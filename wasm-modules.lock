# The browser renderers this build serves, pinned.
#
# Each is built and released by its own repository; `make wasm` fetches them
# and refuses anything whose bytes do not hash to what is written here. The
# digest is the contract: the server already addresses a module by the sha256
# of its own bytes, so if these match, the binary is serving exactly the module
# that repository released.
#
# To move a pin: run `make wasm-update REPO=wasm-markdown TAG=vX.Y.Z` with an
# explicit repository and tag, then review the native and browser pin diff.
