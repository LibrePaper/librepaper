# Rebuilding this workspace is dominated by one link, not by codegen: the
# librepaper test binary is a single crate with the whole suite inside it, and
# relinking it after a one-line edit is the slowest thing in the edit-test
# loop. The default `ld` does that work on one thread. `mold` does it on all
# of them, which is most of the wait.
#
# Cargo has no "use it if present" switch, so this is a requirement in
# practice: a machine without mold fails to link, and gcc says "cannot find
# 'ld'" when it means mold. Install it (`apt install mold`, or the package
# manager's equivalent; CI does) or drop the two lines below.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
