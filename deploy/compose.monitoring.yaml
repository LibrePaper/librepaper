# Optional monitoring stack. Select with `deploy/setup init --monitoring`.
x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    networks: [ingress]

  librepaper:
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    logging: *bounded-logs
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    entrypoint: ["/bin/sh", "/etc/librepaper/grafana-entrypoint.sh"]
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/admin/monitoring/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/librepaper.json
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_LOG_MODE: console
      GF_SERVER_ROUTER_LOGGING: "false"
      GF_LOG_FILTERS: context:error
    secrets:
      - source: grafana-admin-password
        target: grafana_admin_password
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana-entrypoint.sh:/etc/librepaper/grafana-entrypoint.sh:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana.json:/var/lib/grafana/dashboards/librepaper.json:ro
    networks: [ingress, monitoring]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    logging: *bounded-logs
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/var/lib/librepaper-metrics
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - backup-metrics:/var/lib/librepaper-metrics:ro
    networks: [monitoring]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      DATA_SOURCE_URI_FILE: /run/secrets/database_metrics_uri
      DATA_SOURCE_USER_FILE: /run/secrets/database_metrics_user
      DATA_SOURCE_PASS_FILE: /run/secrets/database_metrics_password
    secrets:
      - source: database-metrics-uri
        target: database_metrics_uri
      - source: database-metrics-password
        target: database_metrics_password
      - source: database-metrics-user
        target: database_metrics_user
    networks: [database, monitoring, egress]

secrets:
  grafana-admin-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/grafana_admin_password
  database-metrics-uri:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_metrics_uri
  database-metrics-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_metrics_password
  database-metrics-user:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_metrics_user

networks:
  ingress:
    internal: true
  monitoring:
    internal: true

volumes:
  prometheus:
  grafana:
