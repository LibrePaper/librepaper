# Application settings for a standalone Compose deployment. Set the origins
# and at least one [auth.*] table, then run `./setup init` and start Compose.
# Everything not listed here has a default; see docs/host.md. Backup settings
# belong in the separate resticprofile.toml file.

# app is the application. docs serves published documents and must be a
# different host, because a document is code and the browser is what keeps
# it out of a reader's session. Both names need a DNS record pointing here.
[origins]
app = "https://paper.example"
docs = "https://docs.paper.example"

# Sign-in needs at least one provider. Callback URLs:
# GitHub  https://paper.example/auth/callback
# Google  https://paper.example/auth/callback/google
[auth.github]
client_id = { file = "/run/secrets/github_client_id" }
client_secret = { file = "/run/secrets/github_client_secret" }

# [auth.google]
# client_id = { file = "/run/secrets/google_client_id" }
# client_secret = { file = "/run/secrets/google_client_secret" }

# The local database uses private TCP with SCRAM authentication. The setup
# helper writes separate URLs for the migration owner, app and backup roles;
# each service mounts only its own URL at the same in-container path. External
# databases use sslmode=verify-full and the compose.external-db.yaml overlay.
[storage]
directory = "/var/lib/librepaper"
database_url = { file = "/run/secrets/database_url" }

[server]
# Schema changes run in the one-shot migration service, using librepaper_owner.
migrate = false
# Optional listener override, for example: address = "0.0.0.0:8080"

# Who may publish and comment: "any" signed-in account, a GitHub login, a
# verified Google address, or "@example.org". "anyone" also allows
# anonymous comments.
[access]
publishers = ["any"]
commenters = ["any"]

# Matches the Caddy/app edge network in compose.yaml; do not widen.
[proxy]
trusted_networks = ["172.29.0.0/16"]

# Optional. Per-publisher storage in MiB and uploads per rolling hour.
# [limits]
# publisher_storage_mib = 50
# publisher_uploads_per_hour = 30

# Optional. Without it, documents stay until deleted.
# [retention]
# expire_after = "30d"
# expire_from = "created"

# Private listener for the bundled Prometheus; no host port is published.
[metrics]
address = "0.0.0.0:9091"
