# Local deployment. Run `./setup init` once before starting services. External
# database and monitoring configurations are explicit Compose overlays.
name: librepaper

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: librepaper
      POSTGRES_USER: librepaper_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      # The only Unix socket is private to this container; TCP is always SCRAM.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    secrets:
      - source: postgres-bootstrap-password
        target: postgres_bootstrap_password
      - source: database-owner-password
        target: database_owner_password
      - source: database-app-password
        target: database_app_password
      - source: database-backup-password
        target: database_backup_password
      - source: database-metrics-password
        target: database_metrics_password
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-librepaper-roles.sh:ro
      - ./postgres/roles.sql:/usr/local/share/librepaper/roles.sql:ro
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U librepaper_bootstrap -d librepaper"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [database]

  migrate:
    image: ghcr.io/librepaper/librepaper:${LIBREPAPER_VERSION:-v0.0.21}
    restart: "no"
    logging: *bounded-logs
    command: ["admin", "migrate", "--config", "/etc/librepaper/librepaper.toml"]
    healthcheck:
      disable: true
    secrets:
      - source: database-owner-url
        target: database_url
    volumes:
      - ${LIBREPAPER_CONFIG_FILE:-./librepaper.toml}:/etc/librepaper/librepaper.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]

  librepaper:
    image: ghcr.io/librepaper/librepaper:${LIBREPAPER_VERSION:-v0.0.21}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *bounded-logs
    command: ["admin", "serve", "--config", "/etc/librepaper/librepaper.toml"]
    secrets:
      - source: database-app-url
        target: database_url
      - source: github-client-id
        target: github_client_id
      - source: github-client-secret
        target: github_client_secret
      - source: google-client-id
        target: google_client_id
      - source: google-client-secret
        target: google_client_secret
    volumes:
      - data:/var/lib/librepaper
      - backups:/var/backups/librepaper
      - ${LIBREPAPER_CONFIG_FILE:-./librepaper.toml}:/etc/librepaper/librepaper.toml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, database, egress]

  backup:
    image: ghcr.io/librepaper/librepaper-backup:${LIBREPAPER_VERSION:-v0.0.21}
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
    secrets:
      - source: database-backup-url
        target: database_url
      - source: restic-password
        target: restic_password
      - source: aws-credentials
        target: aws_credentials
      - source: restic-known-hosts
        target: restic_known_hosts
    tmpfs:
      - /run/librepaper-backup:uid=10001,gid=65534,mode=0700
    volumes:
      - data:/var/lib/librepaper:rw
      - backups:/var/backups/librepaper
      - backup-metrics:/var/backups/librepaper/metrics
      - ${LIBREPAPER_CONFIG_FILE:-./librepaper.toml}:/etc/librepaper/librepaper.toml:ro
      - ${LIBREPAPER_RESTICPROFILE_CONFIG_FILE:-./resticprofile.toml}:/etc/resticprofile/resticprofile.toml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database, egress]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *bounded-logs
    depends_on: [librepaper]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, egress]

secrets:
  postgres-bootstrap-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/postgres_bootstrap_password
  database-owner-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_owner_password
  database-app-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_app_password
  database-backup-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_backup_password
  database-metrics-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_metrics_password
  database-owner-url:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_owner_url
  database-app-url:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_app_url
  database-backup-url:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_backup_url
  database-metrics-url:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/database_metrics_url
  github-client-id:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/github_client_id
  github-client-secret:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/github_client_secret
  google-client-id:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/google_client_id
  google-client-secret:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/google_client_secret
  restic-password:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/restic_password
  aws-credentials:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/aws_credentials
  restic-known-hosts:
    file: ${LIBREPAPER_SECRETS_DIR:-./secrets}/restic_known_hosts

networks:
  # Only Caddy and the app share the address range trusted by the app config.
  edge:
    ipam:
      config:
        - subnet: 172.29.0.0/16
  database:
    internal: true
  egress:

volumes:
  postgres:
  data:
  backups:
  backup-metrics:
  caddy-data:
  caddy-config:
