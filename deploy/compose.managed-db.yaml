# A database elsewhere: cp compose.managed-db.yaml compose.override.yaml, then set database_url in librepaper.toml.
services:
  postgres:
    profiles: [unused]
  librepaper:
    depends_on: !reset []
  backup:
    depends_on: !reset []
  postgres-exporter:
    # Or drop these two lines and set DATA_SOURCE_NAME to the provider's monitoring URL.
    profiles: [unused]
