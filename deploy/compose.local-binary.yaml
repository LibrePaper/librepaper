# Production fallback for a host-staged musl executable in deploy/.
services:
  librepaper:
    image: librepaper:${LIBREPAPER_VERSION:-candidate}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        SOURCE: local
        LIBREPAPER_BINARY: librepaper.candidate
  migrate:
    image: librepaper:${LIBREPAPER_VERSION:-candidate}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        SOURCE: local
        LIBREPAPER_BINARY: librepaper.candidate
  backup:
    image: librepaper-backup:${LIBREPAPER_VERSION:-candidate}
    build:
      context: .
      dockerfile: Dockerfile
      target: backup
      args:
        SOURCE: local
        LIBREPAPER_BINARY: librepaper.candidate
