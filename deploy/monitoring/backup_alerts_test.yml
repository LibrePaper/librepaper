rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: backup first-run deadline and zero-success grace
    interval: 1m
    input_series:
      - series: 'librepaper_backup_enabled{instance="node-exporter:9100",job="node"}'
        values: '1+0x2300'
      - series: 'librepaper_backup_first_enabled_timestamp_seconds{instance="node-exporter:9100",job="node"}'
        values: '0+0x2300'
      - series: 'librepaper_backup_job_last_success_timestamp_seconds{instance="node-exporter:9100",job="node",task="backup"}'
        values: '0+0x2300'
      - series: 'librepaper_backup_job_last_success_timestamp_seconds{instance="node-exporter:9100",job="node",task="check"}'
        values: '0+0x2300'
    alert_rule_test:
      - eval_time: 35h
        alertname: BackupFirstRunOverdue
        exp_alerts: []
      - eval_time: 37h
        alertname: BackupFirstRunOverdue
        exp_alerts:
          - exp_labels:
              instance: node-exporter:9100
              job: node
              severity: critical
            exp_annotations:
              summary: The first backup has not succeeded within 36 hours
              description: Check the sidecar logs, repository credentials, and backup schedule.
      - eval_time: 37h
        alertname: BackupLastSuccessStale
        exp_alerts: []

  - name: disabled jobs do not alert and absent sentinel is visible
    interval: 1m
    input_series:
      - series: 'up{instance="node-exporter:9100",job="node"}'
        values: '1+0x20'
      - series: 'librepaper_backup_enabled{instance="node-exporter:9100",job="node"}'
        values: '0+0x20'
      - series: 'librepaper_backup_job_last_result_success{instance="node-exporter:9100",job="node",task="backup"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackupMetricsMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: BackupJobFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: BackupLastSuccessStale
        exp_alerts: []

  - name: absent status sentinel alerts
    interval: 1m
    input_series:
      - series: 'up{instance="node-exporter:9100",job="node"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackupMetricsMissing
        exp_alerts:
          - exp_labels:
              instance: node-exporter:9100
              job: node
              severity: critical
            exp_annotations:
              summary: Backup sidecar status metrics are missing
              description: The node exporter is reachable but has no backup enabled sentinel. Check sidecar startup and metrics volume permissions.

  - name: weekly check deadline is independent from fresh daily backup
    interval: 1m
    input_series:
      - series: 'librepaper_backup_enabled{instance="node-exporter:9100",job="node"}'
        values: '1+0x13500'
      - series: 'librepaper_backup_first_enabled_timestamp_seconds{instance="node-exporter:9100",job="node"}'
        values: '0+0x13500'
      - series: 'librepaper_backup_job_last_success_timestamp_seconds{instance="node-exporter:9100",job="node",task="backup"}'
        values: '0+60x13500'
      - series: 'librepaper_backup_job_last_success_timestamp_seconds{instance="node-exporter:9100",job="node",task="check"}'
        values: '0+0x13500'
    alert_rule_test:
      - eval_time: 9d
        alertname: BackupCheckFirstRunOverdue
        exp_alerts:
          - exp_labels:
              instance: node-exporter:9100
              job: node
              severity: warning
            exp_annotations:
              summary: The first repository check has not succeeded within eight days
              description: Check the scheduled repository check and sidecar logs.
      - eval_time: 9d
        alertname: BackupLastSuccessStale
        exp_alerts: []
      - eval_time: 9d
        alertname: BackupCheckLastSuccessStale
        exp_alerts: []

  - name: failed task label is preserved on the alert
    interval: 1m
    input_series:
      - series: 'librepaper_backup_enabled{instance="node-exporter:9100",job="node"}'
        values: '1+0x20'
      - series: 'librepaper_backup_job_last_result_success{instance="node-exporter:9100",job="node",task="backup"}'
        values: '0+0x20'
      - series: 'librepaper_backup_job_last_result_success{instance="node-exporter:9100",job="node",task="check"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: BackupJobFailed
        exp_alerts:
          - exp_labels:
              instance: node-exporter:9100
              job: node
              severity: critical
              task: backup
            exp_annotations:
              summary: A scheduled backup or repository check failed
              description: Inspect sidecar logs for the job named by the task label.
