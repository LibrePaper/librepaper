# Optional operator configuration for the backup sidecar.
# Backups are idle until you add a [resticprofile] table here, for example:
#
# [resticprofile]
# repository = "s3:https://example.invalid/backups"
# password = "secret"
#
# Or set credentials through the environment:
# [resticprofile.env]
# AWS_ACCESS_KEY_ID = "key"
# AWS_SECRET_ACCESS_KEY = "secret"
