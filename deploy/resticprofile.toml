# Backups are idle until this file has a [resticprofile] table. Example:
#
# [resticprofile]
# repository = "s3:s3.amazonaws.com/your-bucket/restic"
#
# [resticprofile.env]
# RESTIC_PASSWORD = "your-restic-password"
# AWS_ACCESS_KEY_ID = "your-key"
# AWS_SECRET_ACCESS_KEY = "your-secret"
#
# The password and any repository credentials go in the env table: restic reads
# them from the environment. This file is part of every backup.
