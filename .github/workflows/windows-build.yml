name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - name: Fetch pinned browser inputs
        run: |
          node tools/assets/pins.mjs fetch

      - name: Build embedded browser app
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build and check the Windows binary
        shell: pwsh
        run: |
          cargo build --locked -p librepaper --bin librepaper
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build exited with code $LASTEXITCODE"
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          $expected = "librepaper v$version"
          $actual = (& target/debug/librepaper.exe --version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "librepaper.exe --version exited with code $LASTEXITCODE"
          }
          if ($actual -ne $expected) {
            throw "Expected '$expected', got '$actual'"
          }

  # Builds the installers without signing, so a pull request shows whether the desktop app still builds on Windows.
  desktop:
    name: Desktop app (unsigned)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - id: build
        uses: ./.github/actions/build-desktop
        with:
          version: ${{ steps.version.outputs.version }}
          bundles: nsis,msi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-unsigned
          path: |
            ${{ steps.build.outputs.bundle-dir }}/nsis/*.exe
            ${{ steps.build.outputs.bundle-dir }}/msi/*.msi
          if-no-files-found: error
          retention-days: 7
