name: Update Nix package

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to pin (for example v0.0.14)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    if: >
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == 'LibrePaper/librepaper'))
    runs-on: ubuntu-22.04
    steps:
      # This job commits to main, so it runs the helper scripts from main.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: bash tools/release/resolve-stable-release.sh

      - name: Update Nix package
        if: steps.resolve.outputs.proceed == 'true'
        run: bash tools/release/update-nix.sh
        env:
          LIBREPAPER_RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
