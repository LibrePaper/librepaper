# Tagging v* builds every platform and publishes the binaries as a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: komodoc_linux_amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: komodoc_linux_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: komodoc_darwin_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: komodoc_darwin_arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: komodoc_windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # The editor renders in the browser, from the same crate the binary
      # renders with, so both modules are built before the binary embeds them.
      - name: Build the pages and the browser renderers
        shell: bash
        run: |
          cd web && bun install --frozen-lockfile && bun run build && cd ..
          mkdir -p web/dist
          cp README.md web/dist/README.md
          cargo build --profile wasm --target wasm32-unknown-unknown -p komodoc-engine \
            --no-default-features --features markdown
          mkdir -p web/dist/wasm
          cp target/wasm32-unknown-unknown/wasm/komodoc_engine.wasm web/dist/wasm/markdown.wasm
          for feature in bibliography citations; do
            cargo build --profile wasm --target wasm32-unknown-unknown -p komodoc-engine --no-default-features --features "$feature"
            cp target/wasm32-unknown-unknown/wasm/komodoc_engine.wasm "web/dist/wasm/$feature.wasm"
          done
          cargo build --profile wasm --target wasm32-unknown-unknown -p komodoc-engine \
            --no-default-features --features typst
          cp target/wasm32-unknown-unknown/wasm/komodoc_engine.wasm web/dist/wasm/typst.wasm
      - name: Build
        shell: bash
        env:
          KOMODOC_VERSION: ${{ github.ref_name }}
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo install cross --locked
            cross build --release -p komodoc --target ${{ matrix.target }}
          else
            cargo build --release -p komodoc --target ${{ matrix.target }}
          fi
      # install.sh looks for these exact archive names.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a dist/${{ matrix.name }}.zip ./target/${{ matrix.target }}/release/komodoc.exe README.md
          else
            tar -czf dist/${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release komodoc -C ../../.. README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/vincentarelbundock/komodoc/main/deploy/install.sh | sh
            ```
