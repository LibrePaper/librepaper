# Tagging v* builds every platform and publishes the binaries as a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: librepaper_linux_amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: librepaper_linux_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: librepaper_darwin_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: librepaper_darwin_arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: librepaper_windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # The renderers are built and released by their own repositories, and
      # pinned in wasm-modules.lock. Fetching them checks each against its
      # digest, so a release either embeds the modules it pinned or fails.
      - name: Build the pages and fetch the browser renderers
        shell: bash
        run: |
          cd web && bun install --frozen-lockfile && bun run build && cd ..
          mkdir -p web/dist
          cp README.md web/dist/README.md
          make wasm
      - name: Build
        shell: bash
        env:
          LIBREPAPER_VERSION: ${{ github.ref_name }}
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo install cross --locked
            cross build --release -p librepaper --target ${{ matrix.target }}
          else
            cargo build --release -p librepaper --target ${{ matrix.target }}
          fi
      # install.sh looks for these exact archive names.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a dist/${{ matrix.name }}.zip ./target/${{ matrix.target }}/release/librepaper.exe README.md
          else
            tar -czf dist/${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release librepaper -C ../../.. README.md
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              cp "target/${{ matrix.target }}/release/librepaper" dist/librepaper-companion-binary
              osacompile -o "dist/LibrePaper Companion.app" -e 'on run
                do shell script quoted form of ((POSIX path of (path to me)) & "Contents/Resources/librepaper") & " local manage"
              end run
              on open location theURL
                do shell script quoted form of ((POSIX path of (path to me)) & "Contents/Resources/librepaper") & " local open " & quoted form of theURL
              end open location'
              mkdir -p "dist/LibrePaper Companion.app/Contents/Resources"
              cp dist/librepaper-companion-binary "dist/LibrePaper Companion.app/Contents/Resources/librepaper"
              chmod +x "dist/LibrePaper Companion.app/Contents/Resources/librepaper"
              rm dist/librepaper-companion-binary
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier org.librepaper.companion" "dist/LibrePaper Companion.app/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleName LibrePaper Companion" "dist/LibrePaper Companion.app/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "dist/LibrePaper Companion.app/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "dist/LibrePaper Companion.app/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "dist/LibrePaper Companion.app/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string librepaper" "dist/LibrePaper Companion.app/Contents/Info.plist"
              codesign --force --deep --sign - "dist/LibrePaper Companion.app"
              (cd dist && zip -qry "${{ matrix.name }}.app.zip" "LibrePaper Companion.app")
              rm -rf "dist/LibrePaper Companion.app"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp deploy/install-companion.sh deploy/install-companion.ps1 deploy/install-companion.cmd deploy/install.sh dist/
          cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/LibrePaper/librepaper/main/deploy/install.sh | sh
            ```
