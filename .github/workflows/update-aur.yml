name: Update AUR package

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish to the AUR (for example v0.0.14)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    if: >
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == 'LibrePaper/librepaper'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Run helper scripts from the workflow revision, never from the
          # release tag being inspected (which may predate those scripts).
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: bash tools/release/resolve-stable-release.sh

      - name: Update AUR package
        if: steps.resolve.outputs.proceed == 'true'
        run: bash tools/release/update-aur.sh
        env:
          LIBREPAPER_RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
