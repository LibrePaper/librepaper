name: Publish to crates.io

# A version tag publishes the same package used for the release binaries.
# Required secret: CARGO_REGISTRY_TOKEN with publish rights for librepaper.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Check tag matches package version
        run: |
          # `version = "` at line start occurs once in the root manifest, under
          # [workspace.package]; every crate inherits it.
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match librepaper $VERSION" >&2
            exit 1
          fi

      - name: Install linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold

      - name: Fetch pinned browser inputs
        run: |
          node web/tools/fetch-loro-codemirror.mjs
          node web/tools/fetch-modules.mjs

      - name: Build embedded browser app
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
          cd ..
          cp README.md web/dist/README.md

      # One `librepaper` package is generated from the workspace and
      # published from there; see docs/releasing.md.
      - name: Generate the single crate
        run: tools/release/flatten/flatten build

      - name: Publish librepaper
        working-directory: target/flat
        run: cargo publish --locked --allow-dirty --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
