# Publish Docker image for a stable release.
# The versioned application and backup images use the matching release
# archive, Dockerfile, backup/entrypoint.sh and backup/profiles.toml. The
# workflow helper runs from the trusted default-branch workflow revision; only
# a successfully published release tag from this repository is used as the
# build context.

name: Publish Docker image

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish (for example v0.0.14)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: >
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == 'LibrePaper/librepaper'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Run helper scripts from the workflow revision, never from the
          # release tag being inspected (which may predate those scripts).
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: bash tools/release/resolve-stable-release.sh

      - uses: actions/checkout@v6
        if: steps.resolve.outputs.proceed == 'true'
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
        if: steps.resolve.outputs.proceed == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.resolve.outputs.proceed == 'true'

      - uses: docker/login-action@v3
        if: steps.resolve.outputs.proceed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.resolve.outputs.proceed == 'true'
        with:
          context: release-source/deploy
          platforms: linux/amd64,linux/arm64
          target: app
          push: true
          build-args: LIBREPAPER_VERSION=${{ steps.resolve.outputs.tag }}
          tags: |
            ghcr.io/librepaper/librepaper:${{ steps.resolve.outputs.tag }}
          provenance: false

      - uses: docker/build-push-action@v6
        if: steps.resolve.outputs.proceed == 'true'
        with:
          context: release-source/deploy
          platforms: linux/amd64,linux/arm64
          target: backup
          push: true
          build-args: LIBREPAPER_VERSION=${{ steps.resolve.outputs.tag }}
          tags: |
            ghcr.io/librepaper/librepaper-backup:${{ steps.resolve.outputs.tag }}
          provenance: false

      # Publish the kit only after both release-matched images succeeded.
      # Packaging reads the exact verified Git commit, never a dirty workspace.
      - name: Package deployment kit
        if: steps.resolve.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-kit"
          bash tools/release/package-deploy-kit.sh \
            "$TAG" release-source "$RUNNER_TEMP/deploy-kit" "$RELEASE_SHA"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/deploy-kit/librepaper-deploy.tar.gz" \
            --clobber
