# rustfmt, clippy and the tests, on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The pages are Svelte and Skeleton, bundled by vite; the binary embeds
      # what that build produces, so the tests need it before they can read a
      # page. The build also checks the pages against the design system.
      - uses: oven-sh/setup-bun@v2
      # The sync check reads the typst example the way a PDF reader does, by
      # extracting its text with Poppler's pdftotext; check:typst-pdf needs
      # pdfinfo from the same package. .cargo/config.toml links through mold,
      # and gcc reports a missing mold as "cannot find 'ld'". The native
      # LaTeX tests drive a real TeX Live -- pdflatex, xelatex, bibtex and
      # biber, with what the paper corpus and a biblatex fixture load -- and
      # skip themselves on a machine without one, so it is installed here
      # rather than let them pass by doing nothing.
      - run: >-
          sudo apt-get install -y --no-install-recommends
          poppler-utils mold
          texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          texlive-bibtex-extra texlive-xetex biber
      - run: make test

  # `crates/librepaper-engine/.sqlx/` is the compile-time SQL cache: it is what lets an offline build
  # verify every query against `crates/librepaper-engine/migrations/postgres/
  # 0001_catalog.sql` without a live database, and it goes stale the moment a
  # query or that migration changes. This job is the thing that would
  # otherwise let a stale cache merge: none of the jobs above build with
  # SQLX_OFFLINE=false, so none of them would notice.
  sqlx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crate links through mold (.cargo/config.toml) and embeds web/dist
      # with include_dir!, so a job that compiles it needs both the linker and
      # the built pages.
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y --no-install-recommends mold
      - run: make pins web/dist/index.html
      - run: cargo install sqlx-cli --locked --no-default-features --features postgres
      # tools/dev/db sqlx-check starts its own disposable PostgreSQL with
      # `tools/dev/db dev` (Docker is preinstalled on this runner) and fails if
      # `cargo sqlx prepare --check` finds a query the checked-in cache does
      # not cover.
      - run: tools/dev/db sqlx-check

  # SPEC-server-is-a-log.md §14.2: the idempotency and recovery contracts
  # (the single-writer lease, compaction coverage proof, the two
  # deployment-shaped gates) live only in these PostgreSQL-gated cases, which
  # `make test` excludes on purpose because they TRUNCATE whatever database
  # they are pointed at. --test-threads=1 is mandatory: several of them count
  # every commit PostgreSQL records. Docker is preinstalled on this runner.
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # mold and the built pages, for the reason given in the sqlx job.
      - run: sudo apt-get install -y --no-install-recommends mold
      - run: make pins web/dist/index.html
      - run: tools/dev/db test

  # Back up and restore a synthetic dataset through the shipped scheduler
  # image. This uses a local repository and disposable PostgreSQL only.
  backup-sidecar:
    runs-on: ubuntu-latest
    env:
      BACKUP_TEST_BACKENDS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y --no-install-recommends mold
      - run: make pins web/dist/index.html
      - run: docker build -f deploy/Dockerfile --build-arg SOURCE=checkout --target backup -t librepaper-backup-test:local .
      - run: tools/test/suite backup-sidecar

  # Boot the packaged Compose kit and drive ./manage against it, with images
  # built from this checkout.
  deploy-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y --no-install-recommends mold
      - run: make pins web/dist/index.html
      - run: tools/test/suite deploy-install

  quarto-toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mold for the same reason the test job installs it: .cargo/config.toml
      # links through it, and a machine without it fails to link with gcc
      # saying "cannot find 'ld'" when it means mold. This job builds the crate
      # like any other, so it needs the linker like any other. The pages are
      # built for the same reason as in the sqlx job: the crate embeds web/dist.
      - run: >-
          sudo apt-get install -y --no-install-recommends
          mold bubblewrap texlive-latex-base texlive-latex-recommended
      - run: make pins web/dist/index.html
      - run: python -m pip install jupyter ipython nbformat
      # The PDF-preview test repeatedly terminates this runner (cause
      # unconfirmed), so it remains in `tools/test/suite external`; see the open
      # coverage task in docs/architecture/building.md#test-suites. This runs
      # the separate render/failure-log integration test below.
      - run: >-
          cargo test -p librepaper-companion --lib
          real_quarto_render_reports_success_and_retains_a_failure_log
          -- --ignored --test-threads=1

  # The components, in a real browser. Its own job because it is minutes rather
  # than seconds, and because nothing else covers this: a substrate change once
  # left three of these importing a library that had been uninstalled, and they
  # stayed broken for as long as nobody looked, since every other check passed.
  #
  # The editor not mounting at all was invisible the same way. A suite that
  # stays green while the editor cannot come up is measuring the wrong thing,
  # which is the whole reason this job exists.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@v2
      # Each test bundles its own page with vite and drives it through the
      # Chrome DevTools Protocol, so chromium is the whole of what it needs --
      # no binary, no database.
      - run: sudo apt-get install -y --no-install-recommends chromium-browser
      - run: cd web && bun install --frozen-lockfile
      # Several of the tests read the built pages in web/dist, which the job
      # did not build.
      - run: make pins web/dist/index.html
      - run: tools/test/suite browser
