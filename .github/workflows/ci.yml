# rustfmt, clippy and the tests, on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The pages are Svelte and Skeleton, bundled by vite; the binary embeds
      # what that build produces, so the tests need it before they can read a
      # page. The build also checks the pages against the design system.
      - uses: oven-sh/setup-bun@v2
      # The sync check reads the typst example the way a PDF reader does, by
      # extracting its text with Poppler's pdftotext; check:typst-pdf needs
      # pdfinfo from the same package. .cargo/config.toml links through mold,
      # and gcc reports a missing mold as "cannot find 'ld'". The native
      # LaTeX tests drive a real TeX Live -- pdflatex, xelatex, bibtex and
      # biber, with what the paper corpus and a biblatex fixture load -- and
      # skip themselves on a machine without one, so it is installed here
      # rather than let them pass by doing nothing.
      - run: >-
          sudo apt-get install -y --no-install-recommends
          poppler-utils mold
          texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          texlive-bibtex-extra texlive-xetex biber
      - run: make test

  # The fuzz targets, briefly: long enough to catch a regression on an
  # invariant, not long enough to explore. `make fuzz` locally runs them for
  # as long as FUZZ_SECONDS says.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - uses: oven-sh/setup-bun@v2
      - run: cargo install cargo-fuzz --locked
      - run: make fuzz FUZZ_SECONDS=20 FUZZ_TARGETS="paths document"
