# Configuration for the official LibrePaper deployment. tools/deploy/production
# installs it as librepaper/librepaper.toml, mounted read-only at
# /etc/librepaper/librepaper.toml in the application and backup containers.
#
# The OAuth credentials are files that the helper writes from SOPS into
# librepaper/secrets, which compose.override.yaml mounts at /run/secrets. The
# helper never writes their values into this file or into Compose's .env file.

# The container listens on a private port behind the reverse proxy, which
# serves the public HTTPS origins.
[server]
address = "0.0.0.0:8080"
local_companion = false

# app is the application and its API (other Host headers get 421); docs
# isolates rendered documents; site is the project site used for sign-out
# links.
[origins]
app = "https://app.librepaper.org"
docs = "https://docs.librepaper.org"
site = "https://librepaper.org"

# Objects and server secrets live on the named Docker volume. fsync covers
# object writes only; PostgreSQL handles its own durability. To use S3, set
# object_store = "s3" and uncomment [storage.s3].
[storage]
directory = "/var/lib/librepaper"
# The PostgreSQL container's Unix socket on the pgsocket volume; no password.
database_url = "postgresql:///librepaper?host=/var/run/postgresql&user=librepaper"
database_connections = 20
fsync = true
object_store = "filesystem"
# [storage.s3]
# endpoint = "https://s3.example"
# region = "us-east-1"
# bucket = "librepaper-production"
# access_key_id = { env = "LIBREPAPER_S3_ACCESS_KEY_ID" }
# secret_access_key = { env = "LIBREPAPER_S3_SECRET_ACCESS_KEY" }

# Sign-in needs at least one provider, each with both values; omit a table to
# disable it. Callbacks: /auth/callback (GitHub), /auth/callback/google.
[auth.github]
client_id = { file = "/run/secrets/github_client_id" }
client_secret = { file = "/run/secrets/github_client_secret" }

[auth.google]
client_id = { file = "/run/secrets/google_client_id" }
client_secret = { file = "/run/secrets/google_client_secret" }

# publishers: "any" signed-in account, a GitHub login, a verified Google
# email, or @example.org (that exact domain, not subdomains). commenters take
# the same values; "anyone" also allows anonymous comments. Reading by link
# never needs sign-in.
[access]
publishers = ["any"]
commenters = ["any"]

# Storage is per publisher, in MiB; uploads counts project creation, forks and
# figure uploads per rolling hour. deployment_storage_mib caps the whole server.
[limits]
publisher_storage_mib = 50
publisher_uploads_per_hour = 30
# deployment_storage_mib = 10240

# Browsers fetch pinned renderer and LaTeX assets from this mirror, which sees
# their IP. It must allow CORS GET and HEAD from the application origins.
[assets]
mirror = "https://librepaper-s3-assets-0001.s3.bhs.io.cloud.ovh.net/"

# Prometheus, on the private Compose network only.
[metrics]
address = "0.0.0.0:9091"

# Keep in sync with the `edge` network in compose.yaml.
[proxy]
trusted_networks = ["172.29.0.0/16"]

# Optional. Without [retention], documents stay until deleted. expire_from is
# "created" or "updated".
# [retention]
# expire_after = "30d"
# expire_from = "created"

# Optional tracing filter for application logs.
# [logging]
# filter = "info"
