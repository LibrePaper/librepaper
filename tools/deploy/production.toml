# Configuration for the official LibrePaper deployment. tools/deploy/production
# installs it as librepaper/librepaper.toml, mounted read-only at
# /etc/librepaper/librepaper.toml in the application and backup containers.
#
# Values in "@NAME@" (credentials, buckets, endpoints, regions) are filled from
# tools/deploy/keys.yaml (SOPS) by tools/deploy/production at deploy time; the
# rendered file is what lands on the host.

# The container listens on a private port behind the reverse proxy, which
# serves the public HTTPS origins.
[server]
address = "0.0.0.0:8080"
local_companion = false

# app is the application and its API (other Host headers get 421); docs
# isolates rendered documents; site is the project site used for sign-out
# links; admin is the operator graphs origin, behind a password below.
[origins]
app = "https://app.librepaper.org"
docs = "https://docs.librepaper.org"
site = "https://librepaper.org"
admin = "https://admin.librepaper.org"

# Server secrets live on the named Docker volume; user files live in the
# private objects bucket. fsync covers filesystem objects only.
[storage]
directory = "/var/lib/librepaper"
# The PostgreSQL container's Unix socket on the pgsocket volume; no password.
database_url = "postgresql:///librepaper?host=/var/run/postgresql&user=librepaper"
database_connections = 20         # PostgreSQL connection pool size
fsync = true
object_store = "s3"

[storage.s3]
endpoint = "@LIBREPAPER_OBJECTS_S3_ENDPOINT@"
region = "@LIBREPAPER_OBJECTS_S3_REGION@"
bucket = "@LIBREPAPER_OBJECTS_S3_BUCKET@"
access_key_id = "@LIBREPAPER_OBJECTS_S3_ACCESS_KEY_ID@"
secret_access_key = "@LIBREPAPER_OBJECTS_S3_SECRET_ACCESS_KEY@"

# Sign-in needs at least one provider, each with both values; omit a table to
# disable it. Callbacks: /auth/callback (GitHub), /auth/callback/google.
[auth.github]
client_id = "@LIBREPAPER_GITHUB_CLIENT_ID@"
client_secret = "@LIBREPAPER_GITHUB_CLIENT_SECRET@"

[auth.google]
client_id = "@LIBREPAPER_GOOGLE_CLIENT_ID@"
client_secret = "@LIBREPAPER_GOOGLE_CLIENT_SECRET@"

# publishers: "any" signed-in account, a GitHub login, a verified Google
# email, or @example.org (that exact domain, not subdomains). commenters take
# the same values; "anyone" also allows anonymous comments. Reading by link
# never needs sign-in.
[access]
publishers = ["any"]
commenters = ["any"]

# Every limit; commented lines are at their default.
[limits]
# Per account:
publisher_storage_mib = 50         # storage per account, in MiB
publisher_uploads_per_hour = 30    # projects, forks and figure uploads per rolling hour
# Whole server:
# deployment_storage_mib = 5120      # storage for all accounts together; uploads are refused when full
# memory_budget_mib = 512            # memory for loading documents
# log_quota_mib = 32                 # edit history one document holds before compaction; scale with memory_budget_mib
# pending_mib = 64                   # unsaved edits held in memory
# pending_scratch_mib = 161          # unsaved edits spilled to disk; the default follows log_quota_mib
# session_peer_queue_frames = 256    # messages queued per editing connection before it is dropped

# Browsers fetch pinned renderer and LaTeX assets from this mirror, which sees
# their IP. It must allow CORS GET and HEAD from the application origins.
[assets]
mirror = "https://@LIBREPAPER_MIRROR_S3_BUCKET@.s3.@LIBREPAPER_MIRROR_S3_REGION@.io.cloud.ovh.net/"

# Operator graphs: read-only page served on the admin origin, behind a password from SOPS.
[admin]
password = "@LIBREPAPER_ADMIN_PASSWORD@"

# Keep in sync with the `edge` network in compose.yaml.
[proxy]
trusted_networks = ["172.29.0.0/16"]

# Optional. Without it, documents stay until deleted.
# [retention]
# expire_after = "30d"
# expire_from = "updated"            # or "created"

# Optional tracing filter for application logs.
# [logging]
# filter = "info"
