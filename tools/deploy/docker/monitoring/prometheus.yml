global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: librepaper
    metrics_path: /metrics
    static_configs:
      - targets: [librepaper:9091]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
