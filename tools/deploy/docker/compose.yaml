# A whole small deployment: PostgreSQL, LibrePaper, and a proxy that holds the
# certificates for both of its origins.
# Monitoring is a second file; add it by listing both, e.g.
# COMPOSE_FILE=compose.yaml:compose.monitoring.yaml in .env.
#
#   cp .env.example .env   # and fill it in
#   docker compose up -d
#
# The two origins are the thing to get right. A published document is code, and
# what keeps it out of a reader's session is that the browser sees the reader
# and the documents as different sites. So DOMAIN and DOCS_DOMAIN (docs.DOMAIN
# unless set) both need a DNS record pointing here, and the proxy holds a
# certificate for each. The server answers on those two names and on loopback,
# and refuses every other with 421 -- which is also why the proxy must pass
# Host through unchanged.

name: librepaper

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: librepaper
      POSTGRES_USER: librepaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Initialises the cluster with a real password rather than trust.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql/data
    # LibrePaper migrates the schema at start-up, so it must not start against
    # a cluster that is still initialising.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U librepaper -d librepaper"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Nothing outside this network ever talks to it.
    networks: [internal]

  librepaper:
    build:
      context: .
      args:
        SOURCE: ${LIBREPAPER_SOURCE:-release}
        LIBREPAPER_VERSION: ${LIBREPAPER_VERSION:-}
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - admin
      - serve
      - --config
      - /etc/librepaper/config.toml
    # Server settings come from TOML. Database and OAuth values are read only
    # through explicit config references; other .env values configure Compose
    # services and are not server-setting overrides.
    env_file: .env
    environment:
      # Blank deployment-only credentials inherited from env_file.
      POSTGRES_PASSWORD: ""
      LIBREPAPER_DATABASE_URL: postgresql://librepaper:${POSTGRES_PASSWORD}@postgres/librepaper
    volumes:
      - data:/var/lib/librepaper
      - backups:/var/backups/librepaper
      - ./${LIBREPAPER_CONFIG_FILE:-config.toml}:/etc/librepaper/config.toml:ro
    networks: [internal, edge]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *bounded-logs
    depends_on: [librepaper]
    environment:
      DOMAIN: ${DOMAIN}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  # Fixed subnet so config.toml can name it as a trusted proxy.
  edge:
    ipam:
      config:
        - subnet: 172.29.0.0/16
  internal:
    internal: true

volumes:
  postgres:
  data:
  backups:
  caddy-data:
  caddy-config:
