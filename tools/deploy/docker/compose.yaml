# A whole small deployment: PostgreSQL, LibrePaper, and a proxy that obtains
# certificates on-demand. The two origins come from config.toml, and the proxy
# learns them from the server (see Caddyfile), so Compose itself needs no
# settings except the config file.
#
#   cp config.toml.example config.toml
#   edit config.toml for the two origins
#   docker compose up -d
#
# The database is reachable only through a Unix socket shared with the
# application container, which is why it needs no password and no network.

name: librepaper

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: librepaper
      POSTGRES_USER: librepaper
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librepaper -d librepaper"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  librepaper:
    build:
      context: .
      args:
        SOURCE: ${LIBREPAPER_SOURCE:-release}
        LIBREPAPER_VERSION: ${LIBREPAPER_VERSION:-v0.0.20}
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - admin
      - serve
      - --config
      - /etc/librepaper/config.toml
    env_file:
      - path: .env
        required: false
    environment:
      LIBREPAPER_DATABASE_URL: postgresql:///librepaper?host=/var/run/postgresql&user=librepaper
    volumes:
      - data:/var/lib/librepaper
      - backups:/var/backups/librepaper
      - pgsocket:/var/run/postgresql
      - ./${LIBREPAPER_CONFIG_FILE:-config.toml}:/etc/librepaper/config.toml:ro
    networks: [internal, edge]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *bounded-logs
    depends_on: [librepaper]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  # Fixed subnet so config.toml can name it as a trusted proxy.
  edge:
    ipam:
      config:
        - subnet: 172.29.0.0/16
  internal:
    internal: true

volumes:
  postgres:
  pgsocket:
  data:
  backups:
  caddy-data:
  caddy-config:
