# Monitoring: Prometheus, Grafana and the host and PostgreSQL exporters, added
# to compose.yaml. Enable with COMPOSE_FILE=compose.yaml:compose.monitoring.yaml
# exported in the shell or in an optional .env.

name: librepaper

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    volumes:
      - ./monitoring-user.sh:/docker-entrypoint-initdb.d/20-monitoring-user.sh:ro

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *bounded-logs
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    networks: [internal]
    # No host port: only Grafana and the app can reach this service.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/librepaper.json
      GF_SECURITY_ADMIN_USER: admin
      # Forced to change at first login; only seeds a fresh volume.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_LOG_MODE: console
      GF_SERVER_ROUTER_LOGGING: "false"
      GF_LOG_FILTERS: context:error
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal, edge]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *bounded-logs
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [internal]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql:///librepaper?host=/var/run/postgresql&user=librepaper_metrics&sslmode=disable
    volumes:
      - pgsocket:/var/run/postgresql
    networks: [internal]

volumes:
  prometheus:
  grafana:
