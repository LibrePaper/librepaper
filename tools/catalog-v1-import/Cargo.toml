[package]
name = "catalog-v1-import"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "catalog-v1-import"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono-tz = "0.10"
fastcdc = "5"
fs2 = "0.4"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
unicode-normalization = "0.1.25"
zstd = "0.13"
yrs = "0.27"

[dev-dependencies]
tempfile = "3"
