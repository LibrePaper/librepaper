# A whole small deployment: PostgreSQL, LibrePaper, and a proxy that holds the
# certificates for both of its origins.
#
#   cp .env.example .env   # and fill it in
#   docker compose up -d
#
# The two origins are the thing to get right. A published document is code, and
# what keeps it out of a reader's session is that the browser sees the reader
# and the documents as different sites. So DOMAIN and DOCS_DOMAIN (docs.DOMAIN
# unless set) both need a DNS record pointing here, and the proxy holds a
# certificate for each. The server answers on those two names and on loopback,
# and refuses every other with 421 -- which is also why the proxy must pass
# Host through unchanged.

name: librepaper

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: librepaper
      POSTGRES_USER: librepaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?set POSTGRES_EXPORTER_PASSWORD in .env}
      # Initialises the cluster with a real password rather than trust.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./monitoring-user.sh:/docker-entrypoint-initdb.d/20-monitoring-user.sh:ro
    # LibrePaper migrates the schema at start-up, so it must not start against
    # a cluster that is still initialising.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librepaper -d librepaper"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Nothing outside this network ever talks to it.
    networks: [internal]

  librepaper:
    build:
      context: .
      args:
        LIBREPAPER_VERSION: ${LIBREPAPER_VERSION:-}
    # Or drop `build:` and pull a published image instead:
    # image: ghcr.io/librepaper/librepaper:${LIBREPAPER_VERSION}
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - admin
      - serve
      - --port=8080
      - --data-directory=/var/lib/librepaper
      # The public origin, and documents go to DOCS_DOMAIN, which defaults to
      # docs.<this host>. This also fixes the scheme the server believes it is
      # on, which is what marks session cookies Secure.
      - --origin=https://${DOMAIN:?set DOMAIN in .env}
      - --docs-origin=https://${DOCS_DOMAIN:-docs.${DOMAIN}}
      # The loopback companion renders Quarto with the tools on the editor's
      # own machine. In a container there are none, and nobody's browser is on
      # this host.
      - --no-local
      # trusted_proxies: without it every visitor shares the proxy's address
      # for rate limiting.
      - --config=/etc/librepaper/config.yaml
    # App settings from .env reach the server as written, which keeps optional
    # settings optional: a commented line is absent rather than an empty value.
    # OAuth secrets travel through the environment instead of command arguments
    # (which are visible in `ps`). Deployment-only passwords are removed below.
    env_file: .env
    environment:
      # Blank deployment-only credentials inherited from env_file. The app
      # receives its database password only through LIBREPAPER_DATABASE_URL.
      POSTGRES_PASSWORD: ""
      POSTGRES_EXPORTER_PASSWORD: ""
      LIBREPAPER_ADMIN_PASSWORD: ""
      LIBREPAPER_DATABASE_URL: postgresql://librepaper:${POSTGRES_PASSWORD}@postgres/librepaper
      # Who may publish has no default: the server insists you say.
      LIBREPAPER_PUBLISHERS: ${LIBREPAPER_PUBLISHERS:?set LIBREPAPER_PUBLISHERS in .env}
      # Opt-in internal Prometheus endpoint. The container port is not
      # published on the host and is reachable only on the private network.
      LIBREPAPER_METRICS_ADDR: ${LIBREPAPER_METRICS_ADDR:-0.0.0.0:9091}
    volumes:
      - data:/var/lib/librepaper
      - backups:/var/backups/librepaper
      - ./config.yaml:/etc/librepaper/config.yaml:ro
    networks: [internal, edge]

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *bounded-logs
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle=false
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    networks: [internal]
    # No host port: only Grafana and the app can reach this service.

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    logging: *bounded-logs
    depends_on: [prometheus]
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/admin/monitoring/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/librepaper.json
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LIBREPAPER_ADMIN_PASSWORD:?set LIBREPAPER_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_LOG_MODE: console
      GF_SERVER_ROUTER_LOGGING: "false"
      GF_LOG_FILTERS: context:error
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal, edge]
    # The UI and its authenticated API are reachable through Caddy only.

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *bounded-logs
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [internal]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/librepaper?sslmode=disable
      DATA_SOURCE_USER: librepaper_metrics
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?set POSTGRES_EXPORTER_PASSWORD in .env}
    networks: [internal]
    # The exporter uses built-in aggregate PostgreSQL statistics only. It does
    # not collect statement text or publish database connection credentials.

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *bounded-logs
    depends_on: [librepaper]
    environment:
      DOMAIN: ${DOMAIN}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  # Fixed subnet so config.yaml can name it as a trusted proxy.
  edge:
    ipam:
      config:
        - subnet: 172.29.0.0/16
  internal:
    internal: true

volumes:
  postgres:
  data:
  backups:
  caddy-data:
  caddy-config:
  prometheus:
  grafana:
