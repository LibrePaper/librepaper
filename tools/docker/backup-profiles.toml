# This file is owned by the image. Operator backup settings live in the
# separately mounted resticprofile.toml.
includes = ["/etc/resticprofile/resticprofile.toml"]

[global]
scheduler = "crontab:-:/run/librepaper-backup/crontab"

[resticprofile]
initialize = true
lock = "/run/librepaper-backup/lock"
cache-dir = "/var/backups/librepaper/cache"
status-file = "/var/backups/librepaper/status.json"

[resticprofile.backup]
schedule = "daily"
schedule-lock-wait = "2h"
schedule-permission = "user"
extended-status = true
host = "librepaper"
tag = ["librepaper"]
source = ["/usr/local/bin/librepaper-backup-export"]
# restic runs the export and stores its stdout. It saves no snapshot when the export fails.
stdin-from-command = true
stdin-filename = "librepaper-backup.tar"

[resticprofile.retention]
after-backup = true
# Snapshots from before the stream export have other paths. Grouping by path would keep them forever.
group-by = "host,tags"
# The source is the export command, not a snapshot path, so a path filter would match nothing.
path = false
keep-within = "48h"
keep-daily = 14
keep-weekly = 11
prune = true
max-unused = "0"

[resticprofile.check]
schedule = "Mon 06:00"
schedule-lock-wait = "2h"
schedule-permission = "user"
read-data-subset = "10%"
