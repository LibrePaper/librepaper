# This file is owned by the image. Operator backup settings live in the
# separately mounted resticprofile.toml.
includes = ["/etc/resticprofile/resticprofile.toml"]

[global]
scheduler = "crontab:-:/run/librepaper-backup/crontab"

[resticprofile]
initialize = true
lock = "/run/librepaper-backup/lock"
cache-dir = "/var/backups/librepaper/cache"
status-file = "/var/backups/librepaper/status.json"

[resticprofile.backup]
schedule = "daily"
schedule-lock-wait = "2h"
schedule-permission = "user"
extended-status = true
host = "librepaper"
tag = ["librepaper"]
source = ["/var/backups/librepaper/current", "/etc/librepaper/librepaper.toml", "/etc/resticprofile/resticprofile.toml", "/var/lib/librepaper/secrets"]
run-before = "set -eu; rm -rf /var/backups/librepaper/current; librepaper admin backup --config /etc/librepaper/librepaper.toml /var/backups/librepaper/current"
run-finally = "rm -rf /var/backups/librepaper/current"

[resticprofile.retention]
after-backup = true
keep-within = "48h"
keep-daily = 14
keep-weekly = 11
prune = true
max-unused = "0"

[resticprofile.check]
schedule = "Mon 06:00"
schedule-lock-wait = "2h"
schedule-permission = "user"
read-data-subset = "10%"
