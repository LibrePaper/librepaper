# Configuration for the official LibrePaper deployment. tools/deploy-production
# installs it as librepaper/config.toml, mounted read-only at
# /etc/librepaper/config.toml in the application container.
#
# Every setting comes from this file. Secrets are read only through explicit
# { env = "NAME" } references.

# The container listens on a private port behind the reverse proxy, which
# serves the public HTTPS origins. origin is the app and its API (other Host
# headers get 421); docs_origin isolates rendered documents; site_origin is
# the project site used for sign-out links.
[server]
bind = "0.0.0.0"
port = 8080
origin = "https://app.librepaper.org"
docs_origin = "https://docs.librepaper.org"
site_origin = "https://librepaper.org"
local_companion = false

# Objects and server secrets live on the named Docker volume. fsync covers
# object writes only; PostgreSQL handles its own durability. To use S3, set
# object_store = "s3" and uncomment [storage.s3].
[storage]
directory = "/var/lib/librepaper"
database_url = { env = "LIBREPAPER_DATABASE_URL" }
database_connections = 20
fsync = true
object_store = "filesystem"
# [storage.s3]
# endpoint = "https://s3.example"
# region = "us-east-1"
# bucket = "librepaper-production"
# access_key_id = { env = "LIBREPAPER_S3_ACCESS_KEY_ID" }
# secret_access_key = { env = "LIBREPAPER_S3_SECRET_ACCESS_KEY" }

# Sign-in needs at least one provider, each with both values; omit a table to
# disable it. Callbacks: /auth/callback (GitHub), /auth/callback/google.
[auth.github]
client_id = { env = "LIBREPAPER_GITHUB_CLIENT_ID" }
client_secret = { env = "LIBREPAPER_GITHUB_CLIENT_SECRET" }

[auth.google]
client_id = { env = "LIBREPAPER_GOOGLE_CLIENT_ID" }
client_secret = { env = "LIBREPAPER_GOOGLE_CLIENT_SECRET" }

# publishers: "any" signed-in account, a GitHub login, a verified Google
# email, or @example.org (that exact domain, not subdomains). commenters:
# "anyone" also allows anonymous comments. Reading by link never needs
# sign-in.
[access]
publishers = ["any"]
commenters = ["anyone"]

# Storage is per publisher, in MiB; uploads counts project creation, forks and
# figure uploads per rolling hour. deployment_storage_mb caps the whole server.
[limits]
publisher_storage_mb = 50
publisher_uploads_per_hour = 30
# deployment_storage_mb = 10240

# Browsers fetch pinned renderer and LaTeX assets from this mirror, which sees
# their IP. It must allow CORS GET and HEAD from the application origins.
[assets]
mirror = "https://librepaper-s3-assets-0001.s3.bhs.io.cloud.ovh.net/"

# Prometheus, on the private Compose network only.
[metrics]
address = "0.0.0.0:9091"

# Keep in sync with the `edge` network in compose.yaml.
[proxy]
trusted_proxies = ["172.29.0.0/16"]

# Optional. Without [retention], documents stay until deleted. expire_from is
# "created" or "updated".
# [retention]
# expire_after = "30d"
# expire_from = "created"

# Optional tracing filter for application logs.
# [logging]
# filter = "info"

# Optional backup intent, recorded as metadata only: nothing is scheduled,
# encrypted or pruned. frequency is in seconds; warning_count is the number
# of completed backups before the deployment warns.
# [backup]
# destination_class = "local"
# frequency = 86400
# retained_count = 7
# encrypted = true
# warning_count = 2
