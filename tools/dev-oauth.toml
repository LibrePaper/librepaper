# Local application configuration for `make demo` when GitHub credentials are
# loaded from .env or tools/deploy-keys.yaml.
[server]
bind = "127.0.0.1"
port = { env = "LIBREPAPER_PORT" }
origin = { env = "LIBREPAPER_APP_ORIGIN" }
site_origin = { env = "LIBREPAPER_SITE_ORIGIN" }
local_companion = true

[storage]
directory = { env = "LIBREPAPER_DATA" }
database_url = { env = "LIBREPAPER_DATABASE_URL" }
fsync = false
object_store = "filesystem"

[auth.github]
client_id = { env = "LIBREPAPER_GITHUB_CLIENT_ID" }
client_secret = { env = "LIBREPAPER_GITHUB_CLIENT_SECRET" }

[access]
publishers = ["any"]
commenters = ["anyone"]

[demo]
simulate_activity = { env = "LIBREPAPER_SIMULATE_ACTIVITY" }
