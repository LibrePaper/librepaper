# Local application configuration used by `make serve` and the unauthenticated
# Makefile demo. Edit this file to change local server settings.
[server]
bind = "127.0.0.1"
port = { env = "LIBREPAPER_PORT" }
origin = { env = "LIBREPAPER_APP_ORIGIN" }
site_origin = { env = "LIBREPAPER_SITE_ORIGIN" }
local_companion = true

[storage]
directory = { env = "LIBREPAPER_DATA" }
database_url = { env = "LIBREPAPER_DATABASE_URL" }
fsync = false
object_store = "filesystem"

[access]
publishers = ["any"]
commenters = ["anyone"]
