# Reuse the deployment services with a checkout image and loopback-only ports.
# demo-compose writes the Grafana password file and turns the monitoring profile on.
services:
  grafana:
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${PORT:-8081}/admin/monitoring/
      GF_SECURITY_COOKIE_SECURE: "false"
  librepaper:
    image: librepaper:demo
    build:
      context: ${LIBREPAPER_DEMO_ROOT:?demo root is required}
      dockerfile: deploy/Dockerfile
      args:
        SOURCE: checkout
    environment:
      LIBREPAPER_DEMO_APP_ORIGIN: ${LIBREPAPER_DEMO_APP_ORIGIN:-http://localhost:8081}
      LIBREPAPER_DEMO_SITE_ORIGIN: ${LIBREPAPER_DEMO_SITE_ORIGIN:-http://localhost:8082}
      LIBREPAPER_GITHUB_CLIENT_ID: ${LIBREPAPER_GITHUB_CLIENT_ID:-}
      LIBREPAPER_GITHUB_CLIENT_SECRET: ${LIBREPAPER_GITHUB_CLIENT_SECRET:-}
    volumes:
      - type: bind
        source: ${LIBREPAPER_DEMO_CONFIG:?demo config path is required}
        target: /etc/librepaper/librepaper.toml
        read_only: true
  backup:
    image: librepaper-backup:demo
    build:
      context: ${LIBREPAPER_DEMO_ROOT:?demo root is required}
      dockerfile: deploy/Dockerfile
      target: backup
      args:
        SOURCE: checkout
    environment:
      LIBREPAPER_DEMO_APP_ORIGIN: ${LIBREPAPER_DEMO_APP_ORIGIN:-http://localhost:8081}
      LIBREPAPER_DEMO_SITE_ORIGIN: ${LIBREPAPER_DEMO_SITE_ORIGIN:-http://localhost:8082}
    volumes:
      - type: bind
        source: ${LIBREPAPER_DEMO_CONFIG:?demo config path is required}
        target: /etc/librepaper/librepaper.toml
        read_only: true
      - type: bind
        source: ${LIBREPAPER_DEMO_BACKUP_CONFIG:?demo backup config path is required}
        target: /etc/resticprofile/resticprofile.toml
        read_only: true
  caddy:
    ports: !override
      - 127.0.0.1:${PORT:-8081}:80
      - 127.0.0.1:${SITE_PORT:-8082}:8081
    volumes: !override
      - ${LIBREPAPER_DEMO_ROOT:?demo root is required}/tools/dev/demo/caddy:/etc/caddy:ro
      - ${LIBREPAPER_DEMO_ROOT:?demo root is required}/docs/_site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  grafana-admin-password:
    file: ${LIBREPAPER_DEMO_GRAFANA_PASSWORD_FILE:?demo Grafana password file is required}

networks:
  edge:
    ipam:
      config: !override
        - subnet: 172.30.0.0/16
