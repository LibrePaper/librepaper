# Container-ready configuration for make demo with GitHub sign-in.
[origins]
app = { env = "LIBREPAPER_DEMO_APP_ORIGIN" }
site = { env = "LIBREPAPER_DEMO_SITE_ORIGIN" }
admin = "http://admin.localhost:8081"

[storage]
directory = "/var/lib/librepaper"
database_url = "postgresql:///librepaper?host=/var/run/postgresql&user=librepaper"
fsync = false
object_store = "filesystem"

[auth.github]
client_id = { env = "LIBREPAPER_GITHUB_CLIENT_ID" }
client_secret = { env = "LIBREPAPER_GITHUB_CLIENT_SECRET" }

[metrics]
address = "0.0.0.0:9091"

[proxy]
trusted_networks = ["172.30.0.0/16"]

[access]
publishers = ["any"]
commenters = ["anyone"]

[admin]
password = "librepaper-demo-only-password"

[demo]
simulate_activity_days = 21
