[package]
name = "writer-lease-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
