# The CodeMirror binding this build uses, pinned.
#
# Upstream loro-codemirror cannot keep an editor in step with a document that
# holds more than one container, and a LibrePaper document is a map of files,
# so this build uses a fork carrying the fixes until a release contains them:
# see docs/loro-codemirror.md for what is changed and why.
#
# `make loro-codemirror` fetches these files and refuses anything whose bytes
# do not hash to what is written here. They land in web/vendor/loro-codemirror,
# which is build output and not in the repository -- the source lives in the
# fork, so there is one copy of it rather than two to keep in step.
#
# To move the pin: push to the fork, then run
# `make loro-update COMMIT=<full sha>` and review the diff.

