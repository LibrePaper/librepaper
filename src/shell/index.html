<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Komodoc</title>
    <link rel="icon" type="image/svg+xml" href="/assets/komodo-logo.svg" />
    <link rel="stylesheet" href="/pico.css" />
    <link rel="stylesheet" href="/komodoc.css" />
  </head>
  <body>

            <path d="m 5977,8944 c -176,-33 -352,-130 -486,-268 l -55,-56 17,-36 c 10,-20 42,-73 72,-118 129,-195 268,-303 462,-358 115,-33 302,-31 434,4 101,28 216,81 328,153 122,78 148,88 245,94 60,4 91,10 94,19 4,13 -193,221 -333,351 -117,108 -217,164 -375,208 -79,22 -305,26 -403,7 z m 59,-213 c -83,-130 -86,-286 -10,-418 l 24,-41 -38,10 c -134,37 -248,146 -304,291 l -18,48 22,19 c 60,50 251,128 316,129 l 32,1 z m 319,25 c 63,-16 176,-72 217,-107 l 32,-26 -11,-61 c -7,-34 -20,-78 -30,-99 -25,-55 -105,-130 -166,-158 -61,-28 -111,-42 -105,-29 2,5 17,36 33,69 28,55 30,68 30,171 0,106 -1,113 -36,182 -19,40 -31,72 -25,72 6,0 34,-6 61,-14 z" />
            <path d="m 9399,7781 c -50,-51 -35,-121 40,-180 102,-81 243,-111 294,-63 37,35 41,67 17,118 -39,80 -164,153 -263,154 -51,0 -62,-4 -88,-29 z" />
          </g>
          <clipPath id="logomark-page">
            <polygon points="442,330 971,340 971,759 560,759" />
          </clipPath>
        </defs>
        <use class="logo-head" href="#logomark-art" />
        <g clip-path="url(#logomark-page)">
          <use class="logo-page" href="#logomark-art" />
        </g>
      </symbol>
    </svg>
    <nav>
      <ul>
        <li>
          <a class="brand" href="/" aria-label="Komodoc home">
            <svg class="mark" aria-hidden="true"><use href="#logomark" /></svg>
            <strong class="wordmark"><span class="wordmark-komo">komo</span><span class="wordmark-doc">doc</span></strong>
          </a>
        </li>
      </ul>
      <!-- The one link that is the same on every page: what Komodoc is and how
           to use it, from the project's own README. -->
      <ul class="navmid">
        <li>
          <a href="/documentation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
            Documentation
          </a>
        </li>
      </ul>
      <ul>
        <li><small id="who" hidden></small></li>
        <li><a role="button" id="signIn" href="/auth/login" hidden>Sign in</a></li>
        <li><a role="button" id="signOut" href="/auth/logout" hidden>Sign out</a></li>
      </ul>
    </nav>
    <main class="container">
      <!-- The mark and the wordmark, once, above whatever the page is showing. -->
      <div class="hero">
        <svg class="mark" aria-hidden="true"><use href="#logomark" /></svg>
        <span class="wordmark"><span class="wordmark-komo">komo</span><span class="wordmark-doc">doc</span></span>
      </div>
      <p class="tagline">A free collaborative platform to comment on HTML and Markdown documents</p>

      <!-- Signed in: the upload field is the page. Two stages — choose a file,
           then confirm its title — because there is nothing to submit until a
           document exists. -->
      <div id="uploader" hidden>
        <form id="uploadForm">
          <div id="dropzone" class="dropzone">
            <p class="dropzone-title">Drag a document here</p>
            <button type="button" id="pickFile">Upload from computer</button>
            <p><small id="fileLimits"></small></p>
            <input name="file" id="fileInput" type="file" hidden />
          </div>
          <article id="chosen" hidden>
            <header class="chosenfile">
              <strong id="fileName"></strong>
            </header>
            <label for="title">Title</label>
            <input name="title" id="title" required />
            <footer class="chosenactions">
              <button type="button" class="secondary" id="cancelFile">Cancel</button>
              <button type="submit">Submit</button>
            </footer>
          </article>
          <p id="fileError" class="error" hidden></p>
        </form>
      </div>

      <p id="refused" class="error" hidden></p>

      <!-- One toolbar: the dataset on the left, the search that narrows it on
           the right, and bulk actions that appear only once rows are ticked.
           Selection itself lives in the table, under the header tick box. -->
      <div id="browse" class="listbar" hidden>
        <div class="tabs" role="group">
          <button type="button" id="tabAll" aria-pressed="true">All</button>
          <button type="button" id="tabFavorites" aria-pressed="false">Favorites</button>
        </div>
        <div id="selection" class="selectionbar" hidden>
          <small id="selectedCount"></small>
          <button type="button" id="deleteSelected">Delete</button>
        </div>
        <input type="search" id="search" placeholder="Search titles" aria-label="Search document titles" />
      </div>
      <table id="list" hidden>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" aria-label="Select all documents shown" /></th>
            <th></th>
            <th><button type="button" class="sort" data-sort="title">Title</button></th>
            <th><button type="button" class="sort" data-sort="comments">Comments</button></th>
            <th><button type="button" class="sort" data-sort="updated">Updated</button></th>
            <th><button type="button" class="sort" data-sort="viewed">Last viewed</button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>

    <dialog id="shared">
      <article>
        <h3>Ready to share</h3>
        <p><small>Send this link to a colleague. They can comment without signing in.</small></p>
        <input id="sharedLink" readonly />
        <footer class="grid">
          <button type="button" id="copyLink">Copy link</button>
          <a role="button" id="openLink" href="#">Open</a>
        </footer>
      </article>
    </dialog>

    <!-- Deleting documents cannot be undone, so it is confirmed. OK is the
         form's default button and holds focus: Enter alone confirms. -->
    <dialog id="confirmDialog">
      <article>
        <form method="dialog">
          <h3>Delete documents?</h3>
          <p id="confirmText"></p>
          <footer class="grid">
            <button type="submit" value="cancel" class="secondary">Cancel</button>
            <button type="submit" value="ok" autofocus>OK</button>
          </footer>
        </form>
      </article>
    </dialog>

    <script type="module">
      // The size cap and the accepted file types come from config.go, so the
      // page and the server never disagree about what will be refused.
      const CONFIG = __CONFIG__;
      const MAX_HTML = CONFIG.max_html;
      const EXTENSIONS = CONFIG.extensions;
      const MAX_LABEL = Math.round(MAX_HTML / (1024 * 1024)) + " MB";

      const list = document.getElementById("list");
      const rows = document.getElementById("rows");
      const refused = document.getElementById("refused");
      const browse = document.getElementById("browse");
      const search = document.getElementById("search");
      const selection = document.getElementById("selection");
      const selectAll = document.getElementById("selectAll");
      const deleteSelected = document.getElementById("deleteSelected");
      const confirmDialog = document.getElementById("confirmDialog");

      // Favourites are a reader's own bookmarks, not a property of the
      // document, so they live in this browser rather than in the store.
      // When each document was last opened, written by the reader. Sorting by
      // it is the point: a list of papers is usually worked through in the
      // order you last touched them.
      const VIEWED = "komodoc-viewed";
      let viewed = {};
      try {
        viewed = JSON.parse(localStorage.getItem(VIEWED) || "{}");
      } catch {
        /* storage disabled; every document reads as never opened */
      }

      // Comment counts arrive per row, after the list is already drawn, so they
      // are kept here for sorting rather than read back out of the table.
      const counts = new Map();

      // Which column orders the list, and which way. Newest first is the
      // default, since that is what a list of documents is usually for.
      let sortBy = "updated";
      let ascending = false;

      const FAVORITES = "komodoc-favorites";
      const favorites = new Set(JSON.parse(localStorage.getItem(FAVORITES) || "[]"));
      const saveFavorites = () =>
        localStorage.setItem(FAVORITES, JSON.stringify([...favorites]));

      let documents = []; // the full listing; the page filters it in place
      let tab = "all";
      let shown = []; // what the current tab and search leave on screen
      const selected = new Set(); // slugs ticked for deletion

      // The confirmation is a modal dialog whose OK button is the default and
      // has focus, so Enter confirms and Escape cancels.
      function confirmDelete(text) {
        document.getElementById("confirmText").textContent = text;
        return new Promise((resolve) => {
          confirmDialog.returnValue = "";
          confirmDialog.showModal();
          confirmDialog.addEventListener(
            "close",
            () => resolve(confirmDialog.returnValue === "ok"),
            { once: true },
          );
        });
      }

      // One row per document: tick box, star, the title as the link, and the
      // two facts worth a column of their own.
      // "3 days ago" rather than a date: for something you did yourself, how
      // long ago is the question, not when.
      function sinceWhen(stamp) {
        const days = Math.floor((Date.now() - new Date(stamp)) / 86400000);
        if (days <= 0) return "today";
        if (days === 1) return "yesterday";
        if (days < 30) return `${days} days ago`;
        return new Date(stamp).toISOString().slice(0, 10);
      }

      function row(doc) {
        const tr = document.createElement("tr");

        const tick = document.createElement("input");
        tick.type = "checkbox";
        tick.checked = selected.has(doc.slug);
        tick.setAttribute("aria-label", `Select ${doc.title}`);
        tick.onchange = () => {
          if (tick.checked) selected.add(doc.slug);
          else selected.delete(doc.slug);
          drawSelection();
        };

        const star = document.createElement("button");
        star.className = "star";
        star.type = "button";
        const drawStar = () => {
          const on = favorites.has(doc.slug);
          star.textContent = on ? "★" : "☆";
          star.setAttribute("aria-pressed", String(on));
          star.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
        };
        star.onclick = () => {
          if (favorites.has(doc.slug)) favorites.delete(doc.slug);
          else favorites.add(doc.slug);
          saveFavorites();
          drawStar();
          // On the favorites tab, unstarring removes the row from the view.
          if (tab === "favorites") drawList();
        };
        drawStar();

        const link = document.createElement("a");
        link.href = `/docs/${doc.slug}`;
        link.textContent = doc.title;

        const comments = document.createElement("td");
        comments.textContent = "—";
        // Counts live in each document's room rather than in the index, so they
        // are fetched per row instead of kept denormalised.
        fetch(`/api/documents/${doc.slug}`)
          .then((response) => response.json())
          .then((full) => {
            comments.textContent = full.comment_count;
            counts.set(doc.slug, full.comment_count);
          })
          .catch(() => {});

        for (const cell of [tick, star, link]) {
          const td = document.createElement("td");
          td.appendChild(cell);
          tr.appendChild(td);
        }
        tr.appendChild(comments);
        const updated = document.createElement("td");
        updated.textContent = doc.updated_at.slice(0, 10);
        tr.appendChild(updated);

        const seen = document.createElement("td");
        seen.textContent = viewed[doc.slug] ? sinceWhen(viewed[doc.slug]) : "never";
        if (!viewed[doc.slug]) seen.className = "never";
        tr.appendChild(seen);
        return tr;
      }

      // The header tick box selects everything on screen, which is what the
      // reader can see they are about to act on; the count and Delete appear
      // only once something is ticked.
      function drawSelection() {
        const here = shown.filter((doc) => selected.has(doc.slug)).length;
        selectAll.checked = shown.length > 0 && here === shown.length;
        selectAll.indeterminate = here > 0 && here < shown.length;
        document.getElementById("selectedCount").textContent = `${selected.size} selected`;
        selection.hidden = selected.size === 0;
      }

      selectAll.onchange = () => {
        const all = selectAll.checked;
        shown.forEach((doc) => (all ? selected.add(doc.slug) : selected.delete(doc.slug)));
        drawList();
      };

      deleteSelected.onclick = async () => {
        const slugs = [...selected];
        if (!slugs.length) return;
        const plural = slugs.length === 1 ? "" : "s";
        const ok = await confirmDelete(
          `This permanently removes ${slugs.length} document${plural} and every comment on ${slugs.length === 1 ? "it" : "them"}. It cannot be undone.`,
        );
        if (!ok) return;
        await Promise.all(
          slugs.map((slug) =>
            fetch(`/api/documents/${slug}/delete`, { method: "POST" }).catch(() => {}),
          ),
        );
        slugs.forEach((slug) => {
          selected.delete(slug);
          favorites.delete(slug);
        });
        saveFavorites();
        await showList();
      };

      // One row spanning the table, saying why it is empty.
      function emptyRow() {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 6;
        td.className = "emptyrow";
        td.textContent =
          documents.length === 0
            ? "No documents uploaded yet."
            : tab === "favorites" && !search.value.trim()
              ? "No favorites yet. Star a document to keep it here."
              : "No documents match that search.";
        tr.appendChild(td);
        return tr;
      }

      // The tab and the search box are two filters over the same list.
      // One comparison per column. Documents never opened sort as if they were
      // opened at the beginning of time, so they gather at one end rather than
      // scattering through the list.
      function comparing(column, up) {
        const key = {
          title: (doc) => doc.title.toLowerCase(),
          comments: (doc) => counts.get(doc.slug) ?? -1,
          updated: (doc) => doc.updated_at,
          viewed: (doc) => viewed[doc.slug] || "",
        }[column];
        return (a, b) => {
          const left = key(a);
          const right = key(b);
          const order = left < right ? -1 : left > right ? 1 : 0;
          return up ? order : -order;
        };
      }

      function drawSortHeaders() {
        for (const button of document.querySelectorAll(".sort")) {
          const active = button.dataset.sort === sortBy;
          button.setAttribute("aria-sort", active ? (ascending ? "ascending" : "descending") : "none");
          button.className = active ? "sort active" : "sort";
        }
      }

      for (const button of document.querySelectorAll(".sort")) {
        button.onclick = () => {
          // Clicking the column already sorted reverses it; a new column starts
          // in the order that column is usually wanted in.
          if (sortBy === button.dataset.sort) ascending = !ascending;
          else {
            sortBy = button.dataset.sort;
            ascending = sortBy === "title";
          }
          drawList();
        };
      }

      function drawList() {
        const needle = search.value.trim().toLowerCase();
        shown = documents.filter(
          (doc) =>
            (tab === "all" || favorites.has(doc.slug)) &&
            (!needle || doc.title.toLowerCase().includes(needle)),
        );
        shown.sort(comparing(sortBy, ascending));
        rows.innerHTML = "";
        shown.forEach((doc) => rows.appendChild(row(doc)));
        drawSortHeaders();

        // The table stays, empty or not: a page that loses its structure when
        // there is nothing in it is harder to read than one that says so.
        if (shown.length === 0) rows.appendChild(emptyRow());
        list.hidden = false;
        browse.hidden = documents.length === 0;
        drawSelection();
      }

      search.oninput = drawList;
      document.getElementById("tabAll").onclick = () => selectTab("all");
      document.getElementById("tabFavorites").onclick = () => selectTab("favorites");

      function selectTab(which) {
        tab = which;
        document.getElementById("tabAll").setAttribute("aria-pressed", String(which === "all"));
        document
          .getElementById("tabFavorites")
          .setAttribute("aria-pressed", String(which === "favorites"));
        drawList();
      }

      async function showList() {
        const response = await fetch("/api/list", { method: "POST" });
        if (!response.ok) return;
        documents = (await response.json()).documents;
        drawList();
      }

      // Who you are decides what the page is: a sign-in button, or the upload
      // field with your documents under it.
      async function showIdentity() {
        const me = await fetch("/api/me").then((response) => response.json());
        const signedIn = Boolean(me.login);

        document.getElementById("signIn").hidden = signedIn || !me.can_sign_in;
        document.getElementById("signOut").hidden = !signedIn;
        document.getElementById("who").hidden = !signedIn;
        document.getElementById("who").textContent = signedIn ? "@" + me.login : "";
        document.getElementById("uploader").hidden = !me.can_publish;

        if (signedIn && !me.can_publish) {
          refused.textContent =
            `@${me.login} may not publish here; this deployment allows ${me.publishers}.`;
          refused.hidden = false;
        }
        if (me.can_publish) await showList();
      }

      function share(url) {
        document.getElementById("sharedLink").value = url;
        document.getElementById("openLink").href = url;
        document.getElementById("shared").showModal();
      }

      document.getElementById("copyLink").onclick = async () => {
        const input = document.getElementById("sharedLink");
        try {
          await navigator.clipboard.writeText(input.value);
          document.getElementById("copyLink").textContent = "Copied";
        } catch {
          input.select(); // clipboard blocked; let the reader copy by hand
        }
      };

      /* ------------------------------------------------------- file picking */

      const dropzone = document.getElementById("dropzone");
      const chosen = document.getElementById("chosen");
      const fileInput = document.getElementById("fileInput");
      const fileError = document.getElementById("fileError");
      const fileName = document.getElementById("fileName");
      const titleInput = document.querySelector('#uploadForm input[name="title"]');
      fileInput.accept = EXTENSIONS.join(",") + ",text/html";
      document.getElementById("fileLimits").textContent =
        `${EXTENSIONS.join(" or ")} files, up to ${MAX_LABEL}`;

      // Back to stage one: the drop zone, with nothing chosen.
      function clearFile() {
        fileInput.value = "";
        fileError.hidden = true;
        titleInput.value = "";
        chosen.hidden = true;
        dropzone.hidden = false;
      }

      function refuse(message) {
        clearFile();
        fileError.textContent = message;
        fileError.hidden = false;
        return false;
      }

      // Checked here so a 30 MB mistake is caught before the upload, not after.
      function valid(file) {
        if (!file) return false;
        const dot = file.name.lastIndexOf(".");
        const extension = dot < 0 ? "" : file.name.slice(dot).toLowerCase();
        if (!EXTENSIONS.includes(extension)) {
          return refuse(`${file.name} is not a document Komodoc can serve. Only ${EXTENSIONS.join(", ")} work.`);
        }
        if (file.size > MAX_HTML) {
          const size = (file.size / (1024 * 1024)).toFixed(1);
          return refuse(`${file.name} is ${size} MB; the limit is ${MAX_LABEL}.`);
        }
        return true;
      }

      // The document usually names itself: <title> or the first heading in
      // HTML, the first setext or ATX H1 in Markdown. The filename is the
      // fallback, and the CLI does the same.
      function titleFrom(text, name) {
        if (/\.html?$/i.test(name)) {
          const parsed = new DOMParser().parseFromString(text, "text/html");
          const found = parsed.title.trim() || parsed.querySelector("h1")?.textContent.trim();
          if (found) return found;
        } else {
          const atx = text.match(/^#\s+(.+)$/m);
          if (atx) return atx[1].trim();
          const setext = text.match(/^(.+)\n=+\s*$/m);
          if (setext) return setext[1].trim();
        }
        return name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
      }

      // Stage two: the drop zone has done its job, so it gives way to the one
      // remaining decision. The title arrives selected, so typing replaces it
      // and Enter alone accepts it.
      async function choose(file) {
        if (!valid(file)) return false;
        fileError.hidden = true;
        fileName.textContent = file.name;
        dropzone.hidden = true;
        chosen.hidden = false;
        titleInput.value = file.name;
        titleInput.focus();
        titleInput.select();
        const text = await file.text().catch(() => "");
        // The reader may already be typing by the time the file is read.
        if (titleInput.value === file.name) {
          titleInput.value = titleFrom(text, file.name);
          titleInput.select();
        }
        return true;
      }

      function offer(file) {
        // Assigning through a DataTransfer is the only way to put a dropped
        // file into a file input, so the form submits one way for both paths.
        const carrier = new DataTransfer();
        carrier.items.add(file);
        fileInput.files = carrier.files;
        return choose(file);
      }

      document.getElementById("pickFile").onclick = () => fileInput.click();
      // Cancel abandons the choice and goes back to the drop target, which is
      // what Escape in the title field already does.
      document.getElementById("cancelFile").onclick = () => clearFile();
      fileInput.onchange = () => fileInput.files[0] && choose(fileInput.files[0]);

      // Escape backs out of the choice rather than only clearing the field.
      titleInput.onkeydown = (event) => {
        if (event.key !== "Escape") return;
        event.preventDefault();
        clearFile();
      };

      for (const name of ["dragenter", "dragover"]) {
        dropzone.addEventListener(name, (event) => {
          event.preventDefault();
          dropzone.classList.add("dragging");
        });
      }
      for (const name of ["dragleave", "drop"]) {
        dropzone.addEventListener(name, () => dropzone.classList.remove("dragging"));
      }
      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        if (event.dataTransfer.files[0]) offer(event.dataTransfer.files[0]);
      });

      // Dropping anywhere on the page counts, not only on the zone itself.
      document.addEventListener("dragover", (event) => event.preventDefault());
      document.addEventListener("drop", (event) => {
        event.preventDefault();
        const file = event.dataTransfer?.files[0];
        if (file) offer(file);
      });

      document.getElementById("uploadForm").onsubmit = async (event) => {
        event.preventDefault();
        const form = event.target;
        if (!valid(fileInput.files[0])) {
          if (!fileInput.files[0]) refuse("Choose a document to upload.");
          return;
        }
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = "Adding…";
        const response = await fetch("/api/documents", { method: "POST", body: new FormData(form) });
        button.disabled = false;
        button.textContent = "Add document";
        if (!response.ok) {
          alert((await response.json()).error || "upload failed");
          return;
        }
        const doc = await response.json();
        form.reset();
        clearFile();
        await showList();
        share(new URL(doc.url, location.origin).href);
      };

      showIdentity();
    </script>
  </body>
</html>
