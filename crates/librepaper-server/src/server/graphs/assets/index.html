<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LibrePaper graphs</title>
<link rel="stylesheet" href="/uplot.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>LibrePaper graphs</h1>
  <nav id="ranges" aria-label="Range">
    <button type="button" data-seconds="3600">1h</button>
    <button type="button" data-seconds="21600">6h</button>
    <button type="button" data-seconds="86400" class="active">24h</button>
    <button type="button" data-seconds="604800">7d</button>
    <button type="button" data-seconds="2592000">30d</button>
    <button type="button" data-seconds="31536000">1y</button>
  </nav>
  <span id="status" role="status"></span>
</header>
<main id="grid"></main>
<section id="accounts" class="panel">
  <h2>Largest accounts</h2>
  <p id="accounts-total"></p>
  <p id="accounts-expiry"></p>
  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Account</th>
          <th>Status</th>
          <th class="num">Storage</th>
          <th class="num">Documents</th>
          <th>Last sign-in</th>
          <th>Created</th>
          <th>ID</th>
        </tr>
      </thead>
      <tbody id="accounts-rows"></tbody>
    </table>
  </div>
</section>
<script src="/uplot.js"></script>
<script src="/app.js"></script>
</body>
</html>
