# What renders on this side of the network.
#
# The renderers themselves live in their own repositories now -- wasm-markdown,
# wasm-typst, wasm-bibliography, over the shared wasm-helpers -- and are pinned
# here by tag. This crate is what is left once they are gone: authored HTML,
# which never had a browser module of its own, and one name for each renderer
# so that the rest of the binary reaches them where it always did.
#
# It builds no WebAssembly. The browser modules are built and released by those
# repositories, and `make wasm` fetches them by digest.
[package]
name = "librepaper-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# An rlib now, not a cdylib: the exports moved out with the renderers.
crate-type = ["rlib"]

[features]
default = ["markdown", "typst", "citations"]
# Every renderer is optional, which is what having them in crates of their own
# finally makes cheap. A build without `typst` does not link the compiler --
# thirty megabytes of it, and two thirds of this binary's dependency graph.
markdown = ["dep:wasm-markdown"]
typst = ["dep:wasm-typst"]
bibliography = ["dep:wasm-bibliography"]
citations = ["bibliography", "markdown", "wasm-bibliography?/citations"]

[dependencies]
# The shape a compile answers in and the page it produces. Not optional: `html`
# renders through them, and it is always here.
wasm-helpers = { git = "https://github.com/LibrePaper/wasm-helpers", tag = "v0.1.1" }
# `default-features = false` turns off each crate's `exports` feature: their
# `#[no_mangle]` functions belong to the modules they ship, not to this binary.
wasm-markdown = { git = "https://github.com/LibrePaper/wasm-markdown", tag = "v0.1.1", default-features = false, optional = true }
wasm-typst = { git = "https://github.com/LibrePaper/wasm-typst", tag = "v0.1.1", default-features = false, optional = true }
wasm-bibliography = { git = "https://github.com/LibrePaper/wasm-bibliography", tag = "v0.1.1", default-features = false, optional = true }
