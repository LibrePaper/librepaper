# LibrePaper: the command line and the server, one binary.
[package]
name = "librepaper"
version = "0.0.9"
edition = "2021"
publish = false
build = "build.rs"
repository = "https://github.com/LibrePaper/librepaper"

[package.metadata.dist]
# Cargo's publish=false keeps this application off crates.io. It is still the
# one package cargo-dist should build and publish as release artifacts.
dist = true

# The doc comments quote shell sessions and file layouts, not Rust: they are
# read, never run.
[lib]
doctest = false

[[bin]]
name = "librepaper"
path = "src/main.rs"

[dependencies]
ttf-parser = "0.25.1"
# The server. WebSockets come with axum, so nothing here frames them by hand.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal", "process", "io-util", "io-std"] }
axum = { version = "0.8", features = ["ws", "multipart", "http1"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Every JSON body, in and out.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
# GitHub and the deployment the command line talks to. rustls rather than
# OpenSSL, so every target cross-compiles from one machine.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "multipart"] }
# Digests, SigV4, and the signature on every cookie.
sha2 = "0.10"
# Quarto's freezer names a cached computation by the MD5 of its source, so
# reading that cache means computing the same digest. A format requirement,
# not a security choice: nothing here trusts MD5 for anything.
md5 = "0.7"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.9"
# The slug pattern, which the shell shares as a string, and the handful of
# patterns that read documents for seeding.
regex = "1"
# Timestamps in the index and the room, RFC 3339 like the Worker wrote them.
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
chrono-tz = "0.10"
# The shell, compiled in: real .html, .css and .js files under web/dist.
include_dir = "0.7"
# The command line.
clap = { version = "4", features = ["derive", "env"] }
# The blob store is a trait with async methods behind a pointer.
async-trait = "0.1"
url = "2"
percent-encoding = "2"
# Official protocol implementations. LibrePaper owns policy around them, not
# JSON-RPC framing, protocol negotiation, or request correlation.
agent-client-protocol = "2.2.0"
rmcp = { version = "3.4.0", default-features = false, features = ["server", "transport-io"] }
# What a browser shows of a document, for anchoring seeded annotations.
html-escape = "0.2"
# The collaboration substrate (SPEC-loro.md). This version and `loro-crdt` in
# web/package.json are one pin: see tools/check-loro-pin.sh.
loro = "1.16.0"
unicode-normalization = "0.1.25"
# Source versions are deterministic tar streams stored as zstd blobs.
zstd = "0.13"
tar = "0.4"
# `sync` is a WebSocket client, and axum's socket type is the server half of
# the same library. This is the tungstenite axum already builds, over the
# rustls reqwest already builds, so what it adds to the binary is the client
# handshake and nothing else.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
fs2 = "0.4"
chacha20poly1305 = "0.10"
# PostgreSQL is the production catalogue. SQLx supplies the async pool and
# compile-independent migrations; queries are exercised against PostgreSQL in
# integration tests against the production database engine.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }
log = "0.4"
tempfile = "3"
object_store = { version = "0.14", features = ["aws", "fs"] }

# Native dialogs for the companion's approval and folder prompts, with no
# external programs. macOS and Windows use the system toolkits through rfd.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = "0.15"

# Linux draws its own approval dialog (local::dialog) and asks the desktop
# portal for folders. The release binary is static musl, so nothing here may
# link or dlopen a C library: wayland-backend without `client_system` speaks
# the protocol in Rust, sctk without `xkbcommon` (dialog.rs reads raw
# keycodes), x11rb without `allow-unsafe-code`, ashpd over zbus.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
wayland-backend = { version = "0.3.17", default-features = false }
wayland-client = "0.31.15"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
x11rb = "0.14.0"
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
epaint_default_fonts = "0.36.2"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }

[dev-dependencies]
# `start_paused` and `advance`, so the deadline tests move a clock instead of
# waiting on one. Test builds only.
tokio = { version = "1", features = ["test-util"] }
# A font file for the tests to put in a library.
typst-assets = { version = "=0.15.1", features = ["fonts"] }
# Test-only: check that the family names our ttf-parser code extracts match
# the compiler's.
typst = "=0.15.1"
# Test-only: render markdown in the locate corpus test.
comrak = "0.54.0"
sha1 = "0.10"
