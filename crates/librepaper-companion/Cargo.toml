# The companion: the local app, the assistant and the automation peer.
# Internal to librepaper.
[package]
name = "librepaper-companion"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# lol_html hands attribute values back as written; the resource scanner
# decodes their entities.
html-escape.workspace = true
cssparser.workspace = true
lol_html.workspace = true
thiserror.workspace = true
tracing.workspace = true
etcetera.workspace = true
which.workspace = true
similar.workspace = true
librepaper-base = { path = "../librepaper-base" }
librepaper-document = { path = "../librepaper-document" }
tokio.workspace = true
axum.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
reqwest.workspace = true
sha2.workspace = true
# Quarto's freezer names a cached computation by the MD5 of its source, so
# reading that cache means computing the same digest. A format requirement,
# not a security choice: nothing here trusts MD5 for anything.
md5.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
regex.workspace = true
time.workspace = true
clap.workspace = true
async-trait.workspace = true
url.workspace = true
percent-encoding.workspace = true
# Official protocol implementations. LibrePaper owns policy around them, not
# JSON-RPC framing, protocol negotiation, or request correlation.
agent-client-protocol.workspace = true
rmcp.workspace = true
unicode-normalization.workspace = true
# The automation peer is a WebSocket client; tls.rs in librepaper-base installs
# the AWS-LC provider this rustls handle names.
tokio-tungstenite.workspace = true
rustls.workspace = true
uuid.workspace = true
tempfile.workspace = true
zip.workspace = true

# Native dialogs for the companion's approval and folder prompts, with no
# external programs. macOS and Windows use the system toolkits through rfd.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd.workspace = true
tray-icon.workspace = true
tao.workspace = true

# Linux asks the desktop portal for folders through the pure-Rust D-Bus client.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
tray-icon = { workspace = true, features = ["ksni"] }


[dev-dependencies]
# `start_paused` and `advance`, so the deadline tests move a clock instead of
# waiting on one. Test builds only.
tokio = { workspace = true, features = ["test-util"] }
