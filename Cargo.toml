# LibrePaper: two crates. `engine` is what renders on this side of the network
# -- authored HTML, and one name for each renderer pinned from its own
# repository; `librepaper` is the binary, the command line and the server.
#
# The renderers themselves, and the word diff both sides share, live in
# LibrePaper/wasm-* and are pinned by tag. See wasm-modules.lock for the
# browser modules, which are fetched rather than built.
[workspace]
resolver = "2"
members = ["crates/engine", "crates/librepaper"]
# The fuzz targets need libFuzzer and a nightly compiler, so they build on
# their own: `make fuzz`, or `cargo fuzz run <target>` from fuzz/.
exclude = ["fuzz"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

# The edit-test loop rebuilds one very large test binary, and full debuginfo
# is the bulk of what it writes and links. Line tables keep backtraces
# pointing at file and line -- which is all a failing assertion needs -- and
# leave out the variable and type descriptions only a debugger reads.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
