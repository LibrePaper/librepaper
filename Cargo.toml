# LibrePaper's workspace contains the application crate. Renderer implementations
# and the shared text algorithms live in the sibling wasm-* repositories and are
# consumed here through their pinned releases.
#
# The renderers themselves, and the word diff both sides share, live in
# LibrePaper/wasm-* and are pinned by tag. See assets.lock for the
# browser modules, which are fetched rather than built.
[workspace]
resolver = "2"
members = ["crates/librepaper", "crates/librepaper-shell", "crates/librepaper-base", "crates/librepaper-document", "crates/librepaper-engine", "crates/librepaper-room", "crates/librepaper-server", "crates/librepaper-companion"]
# The fuzz targets need libFuzzer and a nightly compiler, so they build on
# their own: `tools/suite fuzz`, or `cargo fuzz --fuzz-dir tools/fuzz run <target>`.
exclude = ["tools/fuzz", "tools/measure"]

# Release packaging is managed by cargo-dist for the sole `librepaper` crate.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = ["github"]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
installers = ["shell", "powershell"]
install-updater = true
github-build-setup = "../dist-build-setup.yml"
install-success-msg = "LibrePaper Companion is installed. In a new terminal, run: librepaper. Then return to your browser."

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

# cargo-dist builds and packages release artifacts with this profile.
[profile.dist]
inherits = "release"

# The edit-test loop rebuilds one very large test binary, and full debuginfo
# is the bulk of what it writes and links. Line tables keep backtraces
# pointing at file and line -- which is all a failing assertion needs -- and
# leave out the variable and type descriptions only a debugger reads.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.package]
version = "0.0.20"
edition = "2021"
license = "MIT"
repository = "https://github.com/LibrePaper/librepaper"

[workspace.dependencies]
ttf-parser = "0.25.1"
# The server. WebSockets come with axum, so nothing here frames them by hand.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal", "process", "io-util", "io-std"] }
axum = { version = "0.8", features = ["ws", "multipart", "http1"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Every JSON body, in and out.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
# GitHub and deployment HTTP. Match object_store's Reqwest generation so the
# binary does not carry two HTTP/TLS client stacks. rustls rather than OpenSSL
# keeps the client portable across release targets.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "multipart", "form", "query"] }
# Digests, SigV4, and the signature on every cookie.
sha2 = "0.10"
# Quarto's freezer names a cached computation by the MD5 of its source, so
# reading that cache means computing the same digest. A format requirement,
# not a security choice: nothing here trusts MD5 for anything.
md5 = "0.7"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.9"
# The slug pattern, which the shell shares as a string, and the handful of
# patterns that read documents for seeding.
regex = "1"
# Timestamps in the index and the room, RFC 3339 like the Worker wrote them.
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# The shell, compiled in: real .html, .css and .js files under web/dist.
include_dir = "0.7"
# The command line.
clap = { version = "4", features = ["derive", "env"] }
# The blob store is a trait with async methods behind a pointer.
async-trait = "0.1"
url = "2"
percent-encoding = "2"
# Official protocol implementations. LibrePaper owns policy around them, not
# JSON-RPC framing, protocol negotiation, or request correlation.
agent-client-protocol = "2.2.0"
rmcp = { version = "3.4.0", default-features = false, features = ["server", "transport-io"] }
# The plist escape is written by hand; this decodes entities in the locate
# corpus test only.
html-escape = "0.2"
# The collaboration substrate (SPEC-loro.md). This version and `loro-crdt` in
# web/package.json are one pin: see tools/check-loro-pin.sh.
loro = "1.16.0"
unicode-normalization = "0.1.25"
# Source versions are deterministic tar streams stored as zstd blobs.
zstd = "0.13"
tar = "0.4"
# `sync` is a WebSocket client, and axum's socket type is the server half of
# the same library. Its rustls transport has no provider of its own; tls.rs
# installs the AWS-LC provider used by Reqwest and object_store as well.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Keep the explicit provider handle for tokio-tungstenite's rustls client. The
# other HTTP and database clients select the same AWS-LC implementation.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
chacha20poly1305 = "0.10"
# Constant-time comparison for token digests and pairing challenges; what the
# RustCrypto crates use themselves.
subtle = "2"
# Bounded caches with per-entry expiry and request coalescing.
moka = { version = "0.12", features = ["sync", "future"] }
# A real unified diff for the permission prompt.
similar = "3"
# Executable lookup on PATH, honouring the execute bit and PATHEXT.
which = "8"
# Platform base directories: XDG on Linux, the native folders elsewhere.
etcetera = "0.8"
# Typed IP networks for the trusted proxies.
ipnet = "2"
# GCRA rate limiting, keyed, with a fake clock for tests.
governor = "0.10"
# Structured diagnostics. The binaries install the subscriber; every crate
# emits through the macros.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# PostgreSQL is the production catalogue. SQLx supplies the async pool and
# compile-independent migrations; queries are exercised against PostgreSQL in
# integration tests against the production database engine.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "time", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v7", "v8", "serde"] }
# Free-space statistics for the storage ceiling warning and the capacity
# snapshot. std has file locks; it has no statvfs.
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
object_store = { version = "0.14", features = ["aws", "fs"] }
# Native dialogs for the companion's approval and folder prompts, with no
# external programs. macOS and Windows use the system toolkits through rfd.
rfd = "0.15"
# Linux draws its own approval dialog (local::dialog) and asks the desktop
# portal for folders. The release binary is static musl, so nothing here may
# link or dlopen a C library: wayland-backend without `client_system` speaks
# the protocol in Rust, sctk without `xkbcommon` (dialog.rs reads raw
# keycodes), x11rb without `allow-unsafe-code`, ashpd over zbus.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
wayland-backend = { version = "0.3.17", default-features = false }
wayland-client = "0.31.15"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
x11rb = "0.14.0"
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
epaint_default_fonts = "0.36.2"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
# A font file for the tests to put in a library.
typst-assets = { version = "=0.15.1", features = ["fonts"] }
# Test-only: check that the family names our ttf-parser code extracts match
# the compiler's.
typst = "=0.15.1"
# Test-only: render markdown in the locate corpus test.
comrak = "0.54.0"
