# Komodoc: three crates. `engine` renders markdown and typst, natively and as
# WebAssembly; `text` holds the word diff and merge that both the binary and
# the engine need; `komodoc` is the binary -- the command line and the server.
[workspace]
resolver = "2"
members = ["crates/engine", "crates/text", "crates/komodoc"]
# The fuzz targets need libFuzzer and a nightly compiler, so they build on
# their own: `make fuzz`, or `cargo fuzz run <target>` from fuzz/.
exclude = ["fuzz"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

# The browser modules are built with this profile: as small as they can be,
# because one of them is fetched by every editor and the other is thirty
# megabytes before compression.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The edit-test loop rebuilds one very large test binary, and full debuginfo
# is the bulk of what it writes and links. Line tables keep backtraces
# pointing at file and line -- which is all a failing assertion needs -- and
# leave out the variable and type descriptions only a debugger reads.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
