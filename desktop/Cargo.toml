[package]
name = "librepaper-desktop"
version = "0.0.44"
edition = "2021"
license = "MIT"
publish = false

# The shell is not part of the LibrePaper workspace: it links the system webview.
[workspace]

[[bin]]
name = "librepaper-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "net", "time"] }
url = "2"

# Package managers update the app on Linux, so only macOS and Windows self-update.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
strip = true
