[package]
name = "librepaper-desktop"
version = "0.0.47"
edition = "2021"
license = "MIT"
publish = false

# The shell is not part of the LibrePaper workspace: it links the system webview.
[workspace]

[[bin]]
name = "librepaper-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "net", "time"] }
url = "2"

# Package managers update the app on Linux, so only macOS and Windows self-update.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
strip = true

# The demo-desktop target builds with this profile. A demo needs no LTO, and
# without it the desktop crate compiles in parallel. Incremental compilation
# is off, as in release and in the workspace demo profile (see the root
# Cargo.toml for why).
[profile.demo]
inherits = "release"
lto = false
codegen-units = 256

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

# tao draws the Linux title bar through GTK, so the shell reads the same settings.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Windows keeps the light or dark choice in the registry.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
