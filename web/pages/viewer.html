<!doctype html>
<html lang="en" data-librepaper-zoom="pdf">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LibrePaper</title>
    <!--
      The text layer's rules, kept here rather than imported from
      pdfjs-dist/web/pdf_viewer.css: that file is four thousand lines of
      annotation, form and editor styling this frame has none of, and the
      dozen rules a selectable text layer actually needs are the dozen below.
    -->
    <style>
      /*
        This frame is on the documents origin and cannot import the shell's
        theme, so the few values it needs are copied from `styles/theme.css`
        by hand: --color-preview for the ground, --color-surface-400 for a
        note, and the interface typeface. They are the shell's numbers, not
        the operating system's -- the controls this page used to draw were
        painted in ButtonFace and SelectedItem, which meant the frame went
        dark on a dark desktop while the application around it stayed light.
        The scheme is pinned in each block for the same reason. The shell's
        default is System, so the page follows the operating system until the
        reader speaks. The mode then arrives by message, because the origins
        differ and this frame cannot read the reader's storage or CSS, and
        viewer.js sets `data-mode` on this element to pin it.
      */
      html { background: #f6f6f4; color-scheme: light; --note: #5d666a; --note-title: #1a2225; --lp-sidebar-bg: #f6f6f4; --lp-sidebar-border: #dcdcd6; --lp-sidebar-text: #1a2225; --lp-sidebar-muted: #5d666a; --lp-sidebar-active: #2563c9; --lp-thumb-filter: none; --lp-thumb-bg: #fff; --lp-marker: rgb(240 110 20); }
      @media (prefers-color-scheme: dark) {
        html { background: #202221; color-scheme: dark; --note: #a2a8a3; --note-title: #eceeed; --lp-sidebar-bg: #202221; --lp-sidebar-border: #343836; --lp-sidebar-text: #eceeed; --lp-sidebar-muted: #a2a8a3; --lp-sidebar-active: #6ea2f5; --lp-thumb-filter: none; --lp-thumb-bg: #fff; --lp-marker: rgb(240 110 20); }
      }
      html[data-mode="light"] { background: #f6f6f4; color-scheme: light; --note: #5d666a; --note-title: #1a2225; --lp-sidebar-bg: #f6f6f4; --lp-sidebar-border: #dcdcd6; --lp-sidebar-text: #1a2225; --lp-sidebar-muted: #5d666a; --lp-sidebar-active: #2563c9; --lp-thumb-filter: none; --lp-thumb-bg: #fff; --lp-marker: rgb(240 110 20); }
      html[data-mode="dark"] { background: #202221; color-scheme: dark; --note: #a2a8a3; --note-title: #eceeed; --lp-sidebar-bg: #202221; --lp-sidebar-border: #343836; --lp-sidebar-text: #eceeed; --lp-sidebar-muted: #a2a8a3; --lp-sidebar-active: #6ea2f5; --lp-thumb-filter: none; --lp-thumb-bg: #fff; --lp-marker: rgb(240 110 20); }
      html { /* A pinch zooms the PDF in viewer.js, not the whole frame. */
             touch-action: pan-x pan-y; }
      body { margin: 0; }
      .grab-to-pan-grab, .grab-to-pan-grab .textLayer span { cursor: grab !important; }
      .grab-to-pan-grabbing { position: fixed; inset: 0; z-index: 50000; cursor: grabbing !important; }
      /*
        Nothing to show, and why. It sits where a page would, at the same
        measure and in the same voice as the reader's own "Not yet rendered"
        card, so which side of the frame boundary wrote it is not a thing
        anybody has to work out.
      */
      .note { max-width: 40rem; padding: 2rem; color: var(--note);
              font: 0.875rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .note p { margin: 0 0 0.5rem; }
      .note .note-title { color: var(--note-title); font-size: 1rem; font-weight: 600; }
      /*
        The sidebar is fixed on the left and lives in its own shadow root, so
        the page column is shifted right by its width: --lp-sidebar-offset is
        set by viewer.js, and the scale was fitted to what is left.
      */
      main { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px 48px;
             margin-left: var(--lp-sidebar-offset, 0px); }
      main > .pages { align-self: safe center; display: flex; flex-direction: column; gap: 24px; }
      /*
        Two pages to a row, as a book opens: the first page sits alone on the
        right, then 2|3, 4|5. Rows start at the same height so the page under
        a point can be told by its top edge.
      */
      main > .pages.spread { display: grid; grid-template-columns: repeat(2, max-content); justify-content: center;
                             align-items: start; }
      .pages.spread > .page:nth-child(odd) { grid-column: 2; justify-self: start; }
      .pages.spread > .page:nth-child(even) { grid-column: 1; justify-self: end; }
      .page { position: relative; background: #fff; box-shadow: 0 1px 5px rgb(24 31 28 / 0.14); overflow: hidden; }
      .page canvas { display: block; }
      /*
        Presentation: black ground, one page to a screen, each snapping to the
        centre. The scale was fitted to the whole screen, so nothing is padded.
        Each page gets a slot one viewport high, with the page centred in it by
        its margins, so a page shorter than the screen never shows a neighbour.
      */
      html.presenting { background: #000; scroll-snap-type: y mandatory; }
      html.presenting main { padding: 0; gap: 0; margin-left: 0; }
      html.presenting main > .pages { gap: 0; }
      html.presenting .page { box-shadow: none; scroll-snap-align: center; scroll-snap-stop: always;
        margin-block: max(0px, calc((100vh - var(--page-height)) / 2)); margin-inline: auto; }
      /*
        Links sit above the text layer. The layer itself lets every pointer
        through so text stays selectable; only the anchors catch it.
      */
      .linkLayer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
      .linkLayer a { position: absolute; display: block; pointer-events: auto; border-radius: 2px; }
      .linkLayer a:hover { background: rgb(0 100 255 / 0.12); }
      /* Search matches, painted by the Custom Highlight API so the text layer is never touched. */
      ::highlight(lp-find) { background-color: rgb(255 214 0 / 0.45); color: inherit; }
      ::highlight(lp-find-current) { background-color: rgb(255 120 0 / 0.6); color: inherit; }
      /*
        Inverted pages for reading in the dark: only while the frame itself is
        dark, and only the canvas, so the text layer and links stay put. The
        sidebar is a shadow root and reads --lp-thumb-filter instead.
      */
      @media (prefers-color-scheme: dark) {
        html:not([data-mode="light"])[data-invert] { --lp-thumb-filter: invert(1) hue-rotate(180deg); }
        html:not([data-mode="light"])[data-invert] .page { background: #1a1c1b; }
        html:not([data-mode="light"])[data-invert] .page canvas { filter: invert(1) hue-rotate(180deg); }
      }
      html[data-mode="dark"][data-invert] { --lp-thumb-filter: invert(1) hue-rotate(180deg); }
      html[data-mode="dark"][data-invert] .page { background: #1a1c1b; }
      html[data-mode="dark"][data-invert] .page canvas { filter: invert(1) hue-rotate(180deg); }
      .textLayer {
        position: absolute;
        inset: 0;
        text-align: initial;
        line-height: 1;
        text-size-adjust: none;
        forced-color-adjust: none;
        transform-origin: 0 0;
        caret-color: CanvasText;
      }
      /*
        Transparent, absolutely placed, and `pre` so the newline a run
        separator carries survives to the agent's walk rather than being
        collapsed away by the layout before anyone reads it.
      */
      .textLayer span {
        color: transparent;
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }
      .textLayer span.markedContent { top: 0; height: 0; }
      /*
        A separator is a text node that must be read and must not be seen.
        Zero-sized and clipped at the page's origin is both; it stays in the
        flow of the DOM, which is the only flow that matters here.
      */
      .textLayer span.gap { left: 0; top: 0; width: 0; height: 0; overflow: hidden; }
      /*
        The hyphen TeX put at a broken line end. It is drawn, but it is
        generated content, so it is not a text node and the two halves of the
        word join without it. See `lib/pdf/text.js`.
      */
      .textLayer span.hyphen::after { content: "-"; }
      /*
        A highlight the agent painted. Its own inline background is the
        colour; all this does is undo the transparency the text layer sets on
        everything, so the wash is visible over the canvas beneath.
      */
      .textLayer mark[data-librepaper] { color: transparent; border-radius: 2px; }
      /* pdf.js measures its fonts with a canvas it keeps on the body. */
      canvas.hiddenCanvasElement { display: none; }
      ::selection { background: rgb(0 100 255 / 0.3); }
    </style>
  </head>
  <body>
    <script type="module" src="../src/entries/viewer.js"></script>
  </body>
</html>
