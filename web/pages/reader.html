<!doctype html>
<html data-theme="komodoc">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Komodoc</title>
    <link rel="icon" type="image/svg+xml" href="/assets/komodoc-logo.svg" />
    <!-- Where this build serves its renderers. The URLs carry a digest of each
         module's bytes and are written in when the page is served, so a module
         cached for a year cannot outlive the loader that speaks to it, and the
         editor never has to ask for them. -->
    <script>window.KOMODOC_MODULES = __MODULES__;</script>
  </head>
  <body>
    <script type="module" src="../src/entries/reader.js"></script>
  </body>
</html>
