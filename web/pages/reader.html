<!doctype html>
<html lang="en" data-theme="librepaper">
  <head>
    <meta charset="utf-8" />
    <!-- The interface is not what a reader zooms, so the page is not zoomable.
         Safari also zooms the page when an input smaller than 16px is focused,
         and maximum-scale=1 stops that too. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <title>LibrePaper</title>
    <meta name="description" content="Read, comment on and edit a LibrePaper document: the source, the rendered paper and the conversation about it, side by side." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LibrePaper" />
    <meta property="og:title" content="LibrePaper" />
    <meta property="og:description" content="Read, comment on and edit a LibrePaper document: the source, the rendered paper and the conversation about it, side by side." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/assets/librepaper-icon.svg" />
    <!-- The renderer URLs arrive as a JSON data block, not an inline script: the
         page's policy refuses inline script. The URLs carry a digest of each
         module's bytes and are written in when the page is served, so a module
         cached for a year cannot outlive the loader that speaks to it, and the
         editor never has to ask for them. -->
    <script type="application/json" id="librepaper-modules">__MODULES__</script>
  </head>
  <body>
    <script type="module" src="../src/entries/reader.js"></script>
  </body>
</html>
