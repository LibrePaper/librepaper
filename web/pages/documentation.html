<!doctype html>
<html data-theme="komodoc">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Documentation · Komodoc</title>
    <link rel="icon" type="image/svg+xml" href="/assets/komodo-logo.svg" />
  </head>
  <body>
    <main class="documentation mx-auto w-full max-w-6xl px-4 py-8">
      <!-- The mark and the wordmark, once, above whatever the page is showing. -->
      <div id="hero"></div>
      <p class="text-surface-600-400 mb-10 text-center">
        A free collaborative platform to comment on HTML, Markdown and Typst documents
      </p>

      <div class="documentation-layout">
        <aside class="toc" aria-label="Table of contents">
          <details open>
            <summary class="cursor-pointer font-semibold">Contents</summary>
            <nav id="tableOfContents"></nav>
          </details>
        </aside>
        <!-- The project's README, rendered into the page when it is served.
             There is no copy of the text here: the placeholder is replaced
             with rendered markdown, so the page and the README cannot drift
             apart. -->
        <article class="prose">__README__</article>
      </div>
    </main>
    <dialog id="imageLightbox" class="image-lightbox m-auto max-w-[90vw] bg-transparent p-0" aria-label="Expanded image">
      <button type="button" class="btn-icon preset-filled-surface-200-800 absolute top-2 right-2" aria-label="Close expanded image">×</button>
      <img alt="" />
    </dialog>
    <script type="module" src="../src/entries/documentation.js"></script>
  </body>
</html>
